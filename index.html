<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0E8D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worktable">
<title>Worktable</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
/* ====== Rosewood Cream palette ====== */
:root{
  --bg:#F0E8D5;--surface:#FAF5EA;--surface-2:#E8E0CC;--surface-3:#DAD0B8;
  --text:#2D1810;--text-muted:#7E6855;--text-faint:#A89888;
  --border:rgba(126,104,85,.12);--border-strong:rgba(126,104,85,.2);
  --accent:#9B3D2A;--accent-soft:#F2DDD5;--accent-strong:#C25A42;--accent-text:#6E2A1A;--accent-on:#FFFFFF;
  --success:#6B7B4A;--success-soft:#E8E8D5;--warning:#9B3D2A;--danger:#B91C1C;
  --r:12px;--rc:16px;--rf:999px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --font:"PingFang SC","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 3px rgba(126,104,85,.08),0 4px 16px rgba(126,104,85,.06);
  --shadow-lg:0 4px 24px rgba(126,104,85,.1);
}

/* ====== Idea page: always dark ====== */
.main.idea-mode{
  background:#1A0E08;background-image:none;
  --bg:#1A0E08;--surface:#2A1810;--surface-2:#3A2418;--surface-3:#4A3020;
  --text:#F0E8D5;--text-muted:#A89888;--text-faint:#7E6855;
  --border:rgba(240,232,213,.08);--border-strong:rgba(240,232,213,.15);
  --accent:#D49888;--accent-soft:#2A1810;--accent-strong:#E8B0A0;--accent-text:#F5C8B8;--accent-on:#1A0E08;
  --success:#7B9050;--danger:#E87878;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{height:100%}
body{font-family:var(--font);background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0.03 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");color:var(--text);font-size:15px;line-height:1.5;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}

/* ====== layout ====== */
.app{display:flex;height:100vh;height:100dvh}
.navrail{flex:none;width:72px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:var(--s3) var(--s2);overflow-y:auto}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--r);color:var(--text-faint)}
.navitem svg{width:20px;height:20px}
.navitem span{font-size:9.5px;font-weight:500;letter-spacing:.02em}
.navitem.active{color:var(--accent);background:var(--accent-soft)}
.navitem.active span{color:var(--accent-text)}
.navrail .spacer{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:5}
.topbar .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.topbar .brand b{font-size:17px;font-weight:600;white-space:nowrap}
.topbar .brand small{font-size:11.5px;color:var(--text-muted)}
.topbar .spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex:none}
.iconbtn:active{background:var(--surface-3)}
.iconbtn svg{width:19px;height:19px}
.syncdot{width:8px;height:8px;border-radius:var(--rf);background:var(--text-faint);flex:none}
.syncdot.on{background:var(--success)}
.syncdot.sync{background:var(--accent);animation:pulse 1s infinite}
.syncdot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes modalIn{from{opacity:0}to{opacity:1}}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4) var(--s4) var(--s6)}
.view{display:none;max-width:820px;margin:0 auto}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:.01em}
.pagehead .sub{font-size:12.5px;color:var(--text-muted)}
.section-title{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:var(--s5) 0 var(--s2)}

/* ====== progress bar ====== */
.pbar{height:6px;border-radius:var(--rf);background:var(--surface-3);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums}

/* ====== list / row / pill ====== */
.list{display:flex;flex-direction:column;gap:var(--s2)}
.row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3)}
.row:active{background:var(--surface-2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rmeta{font-size:12px;color:var(--text-muted);display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:2px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--rf);white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent-text)}
.pill.solid{background:var(--accent);color:var(--accent-on)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.muted{background:var(--surface-3);color:var(--text-muted)}
.pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}

/* ====== todo ====== */
.todo{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3);background:var(--surface);border:1px solid var(--border);border-radius:var(--rc)}
.todo:active{background:var(--surface-2)}
.todo .chk{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--border-strong);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo.done .chk{background:var(--accent);border-color:var(--accent)}
.todo.done .chk svg{opacity:1}
.todo .chk svg{width:13px;height:13px;color:var(--accent-on);opacity:0}
.todo.idea .chk{background:var(--accent-soft);border-color:var(--accent)}
.todo.idea .chk svg{opacity:1;color:var(--accent);width:14px;height:14px}
.todo .tmain{flex:1;min-width:0}
.todo .ttitle{font-size:15px;font-weight:500}
.todo.done .ttitle{color:var(--text-muted);text-decoration:line-through}
.todo .tmeta{font-size:12px;color:var(--text-muted);display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:3px}
.todo .tdel{color:var(--text-faint);opacity:0;transition:opacity .15s;padding:4px}
.todo:active .tdel{opacity:1}

/* ====== project ====== */
.proj{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s4);margin-bottom:var(--s2)}
.proj .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s2);cursor:pointer}
.proj-toggle{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:transform .2s;margin-top:2px}
.proj.collapsed .proj-toggle{transform:rotate(-90deg)}
.proj.collapsed .proj-flow,.proj.collapsed .stage-sec,.proj.collapsed .btnrow,.proj.collapsed .pbar,.proj.collapsed .pstat{display:none}
.proj.collapsed .ph{margin-bottom:0}
.proj .pname{font-size:16px;font-weight:600}
.proj .pnote{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.proj .spent{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.proj .spent small{font-size:11.5px;font-weight:500;color:var(--text-muted)}
.proj .pstat{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:6px}
.proj .exps,.proj .items{margin-top:var(--s3);border-top:1px dashed var(--border);padding-top:var(--s2)}
.proj .et{font-size:12px;color:var(--text-muted);margin-bottom:var(--s2);display:flex;justify-content:space-between;align-items:center}
.exprow{display:flex;align-items:center;gap:var(--s2);padding:5px 0;font-size:13px}
.exprow .eamt{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.exprow .ecat{color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exprow .edel{color:var(--text-faint);opacity:0;font-size:11px}
.exprow:active .edel{opacity:1}
/* project items: checkbox style */
.itemrow{display:flex;align-items:center;gap:var(--s2);padding:6px 0}
.itemrow .ichk{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:transparent}
.itemrow .ichk svg{pointer-events:none;width:11px;height:11px;color:var(--accent-on);opacity:0}
.itemrow.done .ichk,.item-block.done .ichk{background:var(--accent);border-color:var(--accent)}
.itemrow.done .ichk svg,.item-block.done .ichk svg{opacity:1}
.itemrow .iname{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.itemrow.done .iname,.item-block.done .iname{color:var(--text-muted);text-decoration:line-through}
.itemrow .iamt{font-size:12px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.item-add-exp{width:22px;height:22px;border-radius:var(--rf);font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;opacity:.6}
.item-add-exp:active{opacity:1}
.item-block{padding:2px 0}
.item-block+.item-block{border-top:1px solid rgba(126,104,85,.06)}
.item-exps{padding-left:26px;padding-top:2px;padding-bottom:2px}
.item-exps .exprow{padding:3px 0;font-size:12px}
/* flow stages */
.proj-flow{margin-top:var(--s3);border-top:1px dashed var(--border);padding-top:var(--s2)}
.flow-track{display:flex;align-items:center;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:thin}
.flow-track::-webkit-scrollbar{height:3px}
.stage{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.stage-chip{padding:6px 14px;border-radius:var(--rf);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-muted);transition:all .15s}
.stage-chip.s-pending{border-color:var(--border-strong);color:var(--text-faint)}
.stage-chip.s-progress{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.stage-chip.s-done{border-color:var(--success);background:var(--success-soft);color:var(--success);text-decoration:line-through;opacity:.7}
.stage-arrow{flex:none;color:var(--text-faint);font-size:14px;margin:0 -2px;align-self:center;margin-top:8px}
.stage-del{font-size:9px;color:var(--danger);opacity:0;cursor:pointer;margin-top:1px}
.stage:active .stage-del{opacity:.7}
/* attachments */
.proj-files{margin-top:var(--s3);border-top:1px dashed var(--border);padding-top:var(--s2)}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:var(--s2)}
.file-card{position:relative;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--surface-2)}
.file-card:active{border-color:var(--accent)}
.file-thumb{width:100%;height:60px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--surface-3);overflow:hidden}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-name{padding:4px 6px;font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0}
.file-card:active .file-del{opacity:1}
.stage-badge{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:var(--rf);background:var(--accent-soft);color:var(--accent-text);flex:none;cursor:pointer;white-space:nowrap}
/* stage sections (grouped layout) */
.stage-sec{margin-top:var(--s2);border:1px solid var(--border);border-radius:var(--rc);overflow:hidden}
.stage-sec-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.stage-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--text-faint)}
.stage-dot.s-done{background:var(--success)}
.stage-dot.s-progress{background:var(--accent)}
.stage-dot.s-pending{background:var(--text-faint)}
.stage-sec-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0}
.stage-sec-meta{font-size:10px;color:var(--text-faint);white-space:nowrap}
.stage-sec-body{padding:6px 10px}
.stage-sec-body .item-block:last-child{border-bottom:none}
.stage-sec-add{display:flex;gap:6px;padding:4px 10px 8px}
.stage-sec-add button{font-size:11px;padding:4px 10px;border-radius:var(--rf);border:1px dashed var(--border-strong);background:transparent;color:var(--text-muted)}
.item-exps .exprow .eamt{font-size:12px}
.item-exps .exprow .edel{opacity:.3;font-size:10px}
.item-exps .exprow:active .edel{opacity:1}

/* ====== Wish: wish list ====== */
.wish-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s5);margin-bottom:var(--s4);text-align:center;position:relative;overflow:hidden}
.wish-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--accent-soft);opacity:.5}
.wish-hero::after{content:'';position:absolute;bottom:-30px;left:-10px;width:60px;height:60px;border-radius:50%;background:var(--success-soft);opacity:.4}
.wish-hero .wh-ring{width:64px;height:64px;margin:0 auto var(--s2);position:relative;z-index:1}
.wish-hero .wh-ring svg{transform:rotate(-90deg)}
.wish-hero .wh-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.wish-hero .wh-label{font-size:12px;color:var(--text-muted);position:relative;z-index:1}
.wish-hero .wh-stats{display:flex;justify-content:center;gap:var(--s5);margin-top:var(--s2);position:relative;z-index:1}
.wish-hero .wh-stat{text-align:center}
.wish-hero .wh-stat .ws-num{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.wish-hero .wh-stat .ws-lbl{font-size:10px;color:var(--text-muted)}
.wish-quote{font-size:13px;color:var(--text-muted);font-style:italic;text-align:center;padding:var(--s2) var(--s4);margin-bottom:var(--s3);line-height:1.6}
.wish-tabs{display:flex;gap:var(--s1);margin-bottom:var(--s3);overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.wish-tab{padding:6px 12px;border-radius:var(--rf);font-size:13px;white-space:nowrap;color:var(--text-muted);border:1px solid var(--border);display:flex;align-items:center;gap:4px}
.wish-tab.active{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.wish-tab svg{width:14px;height:14px;flex:none}
.wish-grid{display:grid;gap:var(--s3)}
.wish-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s4);cursor:pointer;transition:border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.wish-card:active{border-color:var(--border-strong);box-shadow:var(--shadow)}
.wish-card.done{opacity:.5}
.wish-card.done .wtitle{text-decoration:line-through;color:var(--text-muted)}
.wish-card .wcat-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.wish-card .wtop{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:4px}
.wish-card .wicon{width:28px;height:28px;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-muted)}
.wish-card .wicon svg{width:16px;height:16px}
.wish-card .wtitle{font-weight:600;font-size:15px;line-height:1.4;flex:1;padding-top:2px}
.wish-card .wnote{font-size:13px;color:var(--text-muted);margin-top:4px;line-height:1.5}
.wish-card .wmeta{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.wish-cat{font-size:11px;padding:2px 8px;border-radius:var(--rf);background:var(--surface-2);color:var(--text-muted)}
.wish-pri{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--rf)}
.wish-pri.dream{background:rgba(155,61,42,.12);color:var(--accent)}
.wish-pri.plan{background:rgba(155,61,42,.06);color:var(--accent-text)}
.wish-pri.soon{background:var(--accent-soft);color:var(--accent-strong)}
.wish-pri.done{background:var(--success-soft);color:var(--success)}
.wish-card .wdone-btn{position:absolute;top:var(--s4);right:var(--s4);width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex:none;color:transparent;transition:all .2s}
.wish-card .wdone-btn:active{border-color:var(--success);color:var(--success)}
.wish-card .wdone-btn svg{width:14px;height:14px}
.wish-done-section{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--border)}
.wish-done-header{font-size:13px;color:var(--text-muted);margin-bottom:var(--s3);display:flex;align-items:center;gap:6px}
.wish-done-header svg{width:16px;height:16px;color:var(--success)}
.wish-hero .wh-budget{display:flex;justify-content:center;gap:var(--s3);margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--border);position:relative;z-index:1;font-size:12px;color:var(--text-muted)}
.wish-hero .wh-budget span{font-variant-numeric:tabular-nums}
.wish-card .wbudget{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:13px;flex-wrap:wrap}
.wish-card .wb-amt{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.wish-card .wb-amt.over{color:var(--danger)}
.wish-card .wb-sep{color:var(--text-faint)}
.wish-card .wb-budget{color:var(--text-muted);font-variant-numeric:tabular-nums}
.wish-card .wb-bar{width:100%;height:4px;background:var(--surface-2);border-radius:2px;margin-top:4px;overflow:hidden}
.wish-card .wb-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.wish-card .wb-fill.over{background:var(--danger)}
.wish-exp-list{margin-bottom:var(--s2)}
.wish-exp-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.wish-exp-amt{font-weight:600;font-variant-numeric:tabular-nums}
.wish-exp-name{color:var(--text-muted);font-size:13px;margin-left:8px}
.wish-exp-date{color:var(--text-faint);font-size:11px;margin-left:8px}
.wish-exp-del{background:none;border:none;color:var(--danger);cursor:pointer;padding:4px;opacity:.6}
.wish-exp-del:active{opacity:1}
.wish-exp-del svg{width:16px;height:16px}
.wish-exp-summary{font-size:12px;color:var(--text-muted);margin-bottom:var(--s2);padding:6px 10px;background:var(--surface-2);border-radius:var(--r)}
.wish-exp-add{display:flex;gap:6px;align-items:center}
.wish-exp-add input{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:var(--font);outline:none;color:var(--text)}
.wish-exp-add input:focus{border-color:var(--accent)}
.wish-exp-add .btn{padding:8px 12px;font-size:13px}

/* ====== Idea: glass bubbles (always dark) ====== */
.bubble-canvas{position:relative;min-height:420px;overflow:hidden}
.g-bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;cursor:pointer;user-select:none;transition:transform .2s ease;z-index:2;padding:6px 14px;word-break:break-word;overflow:hidden;line-height:1.3}
.g-bubble:hover{transform:scale(1.05);z-index:10}
.g-bubble:active{transform:scale(.96)}
.g-bubble.glass{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px) saturate(170%);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.95);
  box-shadow:0 0 28px rgba(232,184,125,.1),0 4px 24px rgba(0,0,0,.25),inset 0 0 24px rgba(255,255,255,.06);
  animation:bubble-glow 4s ease-in-out infinite alternate;
}
.g-bubble.glass::before{
  content:'';position:absolute;top:10%;left:15%;width:35%;height:30%;
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.3),transparent 70%);
  filter:blur(3px);pointer-events:none
}
.g-bubble.glass::after{
  content:'';position:absolute;bottom:8%;right:12%;width:14%;height:14%;
  border-radius:50%;background:radial-gradient(circle,rgba(232,184,125,.2),transparent 70%);
  filter:blur(2px);pointer-events:none
}
@media(prefers-reduced-motion:no-preference){
  .g-bubble{animation:gfloat 7s ease-in-out infinite,bubble-glow 4s ease-in-out infinite alternate}
  .g-bubble:nth-child(2n){animation-delay:1.5s,0s;animation-duration:6s,5s}
  .g-bubble:nth-child(3n){animation-delay:.8s,2s;animation-duration:8s,6s}
  .g-bubble:nth-child(5n){animation-delay:2s,1s}
}
@keyframes gfloat{0%,100%{transform:translateY(0) translateX(0) rotate(0deg)}33%{transform:translateY(-8px) translateX(4px) rotate(1deg)}66%{transform:translateY(-4px) translateX(-3px) rotate(-1deg)}}
@keyframes bubble-glow{0%{box-shadow:0 0 28px rgba(232,184,125,.1),0 4px 24px rgba(0,0,0,.25),inset 0 0 24px rgba(255,255,255,.06)}100%{box-shadow:0 0 40px rgba(232,184,125,.2),0 4px 24px rgba(0,0,0,.25),inset 0 0 30px rgba(255,255,255,.1)}}
.deco-svg{position:absolute;pointer-events:none;z-index:0}
.deco-svg.lamp{animation:lamp-flicker 3s ease-in-out infinite alternate}
@keyframes lamp-flicker{0%{opacity:.5;filter:brightness(1)}50%{opacity:.48;filter:brightness(.95)}100%{opacity:.52;filter:brightness(1.08)}}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(245,213,168,.8);box-shadow:0 0 10px 4px rgba(245,213,168,.3),0 0 20px 6px rgba(245,213,168,.1);pointer-events:none;z-index:1;animation:firefly 8s ease-in-out infinite}
.firefly:nth-child(2n){animation-delay:2s;animation-duration:11s;width:3px;height:3px}
.firefly:nth-child(3n){animation-delay:4s;animation-duration:13s;width:5px;height:5px;background:rgba(255,220,180,.8);box-shadow:0 0 12px 5px rgba(255,220,180,.3),0 0 24px 8px rgba(255,220,180,.1)}
.firefly:nth-child(5n){animation-delay:1s;animation-duration:9s}
.firefly:nth-child(7n){animation-delay:3s;animation-duration:10s;width:2px;height:2px;background:rgba(230,200,255,.7);box-shadow:0 0 8px 3px rgba(230,200,255,.2)}
@keyframes firefly{0%,100%{opacity:.1;transform:translate(0,0) scale(1)}20%{opacity:.9;transform:translate(30px,-35px) scale(1.2)}40%{opacity:.3;transform:translate(-20px,-25px) scale(.8)}60%{opacity:.7;transform:translate(35px,-12px) scale(1)}80%{opacity:.5;transform:translate(-15px,-30px) scale(1.1)}}
.dust-mote{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,210,140,.4);box-shadow:0 0 4px 1px rgba(255,200,120,.15);pointer-events:none;z-index:1;animation:dust-drift 12s linear infinite}
@keyframes dust-drift{0%{opacity:0;transform:translate(0,0)}10%{opacity:.6}50%{opacity:.4;transform:translate(15px,-60px)}90%{opacity:.2}100%{opacity:0;transform:translate(30px,-120px)}}
.glow-orb{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.08),transparent 70%);pointer-events:none;z-index:0;animation:glow-pulse 6s ease-in-out infinite alternate}
@keyframes glow-pulse{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.3);opacity:.7}}
.main.idea-mode .bubble-canvas{
  background:#1A0E08 url('idea-bg-final.jpg') center center/cover no-repeat;
  position:relative;
  min-height:calc(100vh - 100px);
}
.main.idea-mode .bubble-canvas::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(26,15,10,.3) 0%,transparent 15%,transparent 90%,rgba(26,15,10,.3) 100%);
  animation:ambient-breathe 8s ease-in-out infinite alternate;
}
@keyframes ambient-breathe{0%{opacity:.7}100%{opacity:1}}
.main.idea-mode .g-bubble.glass{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.main.idea-mode .pagehead h1{background:linear-gradient(135deg,#F5D5A8,#E8B87D);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.main.idea-mode .content{background:var(--bg);padding:0;overflow:hidden}
.main.idea-mode .pagehead{padding:var(--s4) var(--s4) var(--s3);margin-bottom:0}

/* ====== calendar ====== */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3);margin-bottom:var(--s4)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3)}
.cal-head b{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:var(--s2)}
.cal-nav button{width:30px;height:30px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--text-faint);padding:4px 0}
.cal-day{text-align:center;padding:7px 0;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;position:relative}
.cal-day.empty{cursor:default}
.cal-day.other{color:var(--text-faint)}
.cal-day.today{background:var(--accent);color:var(--accent-on)}
.cal-day.sel{background:var(--accent-soft);color:var(--accent-text)}
.cal-day .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:var(--rf);background:var(--accent)}
.cal-day.today .dot{background:var(--accent-on)}

/* ====== travel ====== */
#travelmap{border-radius:var(--rc);overflow:hidden;margin-bottom:var(--s4);border:1px solid var(--border);background:var(--surface-3)}
.trip{display:flex;gap:var(--s3);background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3);margin-bottom:var(--s2);overflow:hidden;transition:transform .15s,box-shadow .15s}
.trip:active{background:var(--surface-2);transform:scale(.99)}
.tripimg{width:72px;height:72px;border-radius:var(--r);object-fit:cover;flex:none;background:var(--surface-3)}
.tripbody{flex:1;min-width:0}
.tripplace{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tripdate{font-size:12px;color:var(--text-muted);margin-top:2px}
.tripnote{font-size:12.5px;color:var(--text-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tripmethod{font-size:11px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:1px 7px;border-radius:var(--rf);display:inline-block;margin-top:3px}
.photogrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.phototile{position:relative;width:60px;height:60px;flex:none}
.phototile img{width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.phototile::after{content:'×';position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--danger);color:#fff;border-radius:var(--rf);font-size:11px;display:flex;align-items:center;justify-content:center}
.route-svg{width:100%;height:200px;margin-bottom:var(--s4)}
.search-result{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px var(--s3);font-size:13px;cursor:pointer;margin-top:4px}
.search-result:hover{background:var(--surface-3)}
/* trip detail full page */
.trip-detail{max-width:900px;margin:0 auto}
.trip-hero{position:relative;height:200px;border-radius:var(--rc);overflow:hidden;margin-bottom:var(--s4)}
.trip-hero img{width:100%;height:100%;object-fit:cover}
.trip-hero .hero-ovr{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65));display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4)}
.trip-hero .hero-ovr h2{color:#fff;font-size:22px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.trip-hero .hero-ovr .hero-meta{color:rgba(255,255,255,.85);font-size:13px;margin-top:4px}
.trip-detail-map{height:280px;border-radius:var(--rc);overflow:hidden;border:1px solid var(--border);margin-bottom:var(--s4)}
.trip-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s4)}
.trip-info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3)}
.trip-info-card .ic-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.trip-info-card .ic-val{font-size:15px;font-weight:600}
.trip-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--s2);margin-bottom:var(--s4)}
.trip-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r)}
.trip-timeline{position:relative;padding-left:24px;margin-bottom:var(--s4)}
.trip-timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border-strong)}
.tl-item{position:relative;padding-bottom:var(--s3)}
.tl-item::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl-item .tl-date{font-size:11px;color:var(--text-muted);font-weight:600}
.tl-item .tl-body{font-size:14px;margin-top:2px}
/* money redesign */
.money-compact{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.money-chip{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px}
.money-chip .mc-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.money-chip .mc-val{font-size:15px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.money-stats-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:10px var(--s3);cursor:pointer;margin-top:var(--s3)}
.money-stats-toggle:hover{border-color:var(--border-strong)}
.money-stats-toggle .mst-lbl{font-size:13px;font-weight:600;color:var(--text)}
.money-stats-toggle .mst-hint{font-size:11px;color:var(--text-faint)}
.year-sel{display:flex;gap:var(--s1);margin-bottom:var(--s3);flex-wrap:wrap}
.year-btn{padding:5px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted)}
.year-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.money-monthly{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3);margin-bottom:var(--s4)}
.month-row{display:flex;align-items:center;gap:var(--s2);padding:4px 0}
.month-row.empty{opacity:.4}
.month-lbl{font-size:11px;color:var(--text-muted);width:28px;flex:none;font-weight:500}
.month-bar{flex:1;height:14px;background:var(--surface-3);border-radius:var(--r);overflow:hidden;display:flex}
.mb-inc{display:block;height:100%;background:#6B7B4A;border-radius:var(--r) 0 0 var(--r)}
.mb-inv{display:block;height:100%;background:#9B3D2A;border-radius:0 var(--r) var(--r) 0}
.month-val{font-size:11px;font-weight:600;width:56px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.money-flow{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s4);margin-bottom:var(--s4)}
.flow-bar{display:flex;height:28px;border-radius:var(--r);overflow:hidden;margin-top:var(--s2)}
.flow-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;transition:flex .3s;cursor:default}
.money-cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3);margin-bottom:var(--s2)}
.money-cat-card .mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.money-cat-card .mc-title{font-size:14px;font-weight:600}
.money-cat-card .mc-amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.mc-bar{height:8px;border-radius:var(--rf);background:var(--surface-3);overflow:hidden}
.mc-bar>i{display:block;height:100%;border-radius:inherit}
.mc-items{margin-top:var(--s2)}
.mc-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.mc-item .mc-status{font-size:11px;padding:1px 7px;border-radius:var(--rf);font-weight:600}
/* reading list */
.read-compact{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.read-chip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;text-align:center}
.read-chip .rc-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.read-chip .rc-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.read-filters{display:flex;gap:6px;margin-bottom:var(--s3);flex-wrap:wrap}
.read-filter{padding:5px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted)}
.read-filter.active{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.read-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3);margin-bottom:var(--s2);cursor:pointer;transition:border-color .15s}
.read-card:hover{border-color:var(--border-strong)}
.read-card .rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.read-card .rc-title{font-size:15px;font-weight:600;line-height:1.3}
.read-card .rc-author{font-size:12px;color:var(--text-muted);margin-top:2px}
.read-card .rc-badge{font-size:10px;padding:2px 8px;border-radius:var(--rf);font-weight:600;flex:none;white-space:nowrap}
.read-badge-want{background:var(--surface-3);color:var(--text-muted)}
.read-badge-reading{background:var(--accent-soft);color:var(--accent-text)}
.read-badge-done{background:var(--success-soft);color:var(--success)}
.read-card .rc-meta{display:flex;align-items:center;gap:var(--s2);margin-top:8px;flex-wrap:wrap}
.read-card .rc-cat{font-size:11px;padding:2px 8px;border-radius:var(--rf);background:var(--surface-2);color:var(--text-muted)}
.read-card .rc-prog{display:flex;align-items:center;gap:6px;flex:1;min-width:80px}
.read-card .rc-prog .pbar{width:60px;height:6px;border-radius:var(--rf);background:var(--surface-3);overflow:hidden}
.read-card .rc-stars{color:var(--accent);font-size:13px;letter-spacing:1px}
/* study milestones */
.ms-list{margin-top:6px}
.ms-row{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.ms-row .ms-chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:transparent;margin-top:2px}
.ms-row .ms-chk svg{pointer-events:none;width:10px;height:10px;color:var(--accent-on);opacity:0}
.ms-row.done .ms-chk{background:var(--accent);border-color:var(--accent)}
.ms-row.done .ms-chk svg{opacity:1}
.ms-row .ms-date{font-size:11px;color:var(--text-faint);white-space:nowrap;flex:none;margin-top:3px;min-width:56px}
.ms-row .ms-title{font-size:13px;flex:1;min-width:0;line-height:1.3}
.ms-row.done .ms-title{text-decoration:line-through;color:var(--text-muted)}
.ms-row .ms-del{font-size:11px;color:var(--danger);cursor:pointer;flex:none;margin-top:3px}
.ms-add-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.ms-add-row input[type=date]{width:130px;flex:none}
.ms-add-row input[type=text]{flex:1;min-width:0}
.ms-inline-add{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.ms-inline-add input{border:1px solid var(--border);border-radius:var(--r);padding:5px 8px;font-size:13px}
.ms-inline-add input[type=date]{width:130px;flex:none}
.ms-inline-add input[type=text]{flex:1;min-width:0}
/* journal full page */
.journal-editor{max-width:680px;margin:0 auto}
.journal-editor .je-header{text-align:center;margin-bottom:var(--s4);padding-bottom:var(--s3);border-bottom:1px dashed var(--border-strong)}
.journal-editor .je-date{font-size:13px;color:var(--text-muted)}
.journal-editor .je-title{font-size:24px;font-weight:700;margin-top:6px;border:none;background:none;width:100%;text-align:center;outline:none;font-family:var(--font)}
.journal-editor .je-title::placeholder{color:var(--text-faint)}
.journal-mood-row{display:flex;justify-content:center;gap:var(--s2);margin-bottom:var(--s4)}
.journal-mood{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.15s}
.journal-mood.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.15)}
.journal-editor .je-body{width:100%;min-height:300px;border:none;background:none;outline:none;font-size:16px;line-height:1.8;font-family:var(--font);resize:none;color:var(--text)}
.journal-editor .je-body::placeholder{color:var(--text-faint)}
.journal-editor .je-toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s3);padding-top:var(--s3);border-top:1px dashed var(--border-strong)}
/* study vocab */
.vocab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s4)}
.vocab-stat{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s3)}
.vocab-stat .vs-val{font-size:28px;font-weight:700;color:var(--accent)}
.vocab-stat .vs-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s6);text-align:center;margin-bottom:var(--s4);min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:transform .2s}
.flashcard:active{transform:scale(.98)}
.flashcard .fc-word{font-size:28px;font-weight:700}
.flashcard .fc-phonetic{font-size:14px;color:var(--text-muted);margin-top:4px}
.flashcard .fc-meaning{font-size:16px;margin-top:var(--s3);color:var(--accent-text);display:none}
.flashcard.flip .fc-meaning{display:block}
.flashcard.flip .fc-word{font-size:18px;color:var(--text-muted)}
.vocab-progress{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.vocab-progress .vp-bar{flex:1;height:8px;border-radius:var(--rf);background:var(--surface-3);overflow:hidden}
.vocab-progress .vp-bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.vocab-progress .vp-txt{font-size:13px;font-weight:600;flex:none}

/* ====== journal ====== */
.journal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);padding:var(--s4);margin-bottom:var(--s2);cursor:pointer}
.journal-card:active{background:var(--surface-2)}
.journal-card .jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.journal-card .jdate{font-size:12px;color:var(--text-muted)}
.journal-card .jmood{font-size:18px}
.journal-card .jtitle{font-size:15px;font-weight:600}
.journal-card .jbody{font-size:13.5px;color:var(--text-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ====== empty / modal / form ====== */
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--text-faint)}
.empty svg{width:40px;height:40px;margin-bottom:var(--s2);opacity:.5}
.empty p{font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10000;padding:env(safe-area-inset-bottom)}
.modal.show{display:flex}
.sheet{background:var(--surface);border-radius:var(--rc) var(--rc) 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:var(--s4);padding-bottom:calc(var(--s4) + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.15)}
#pickmap{position:relative;isolation:isolate}
#pickmap .leaflet-container{background:var(--surface-3)}
#pickmap .leaflet-tile-pane,#pickmap .leaflet-layer,#pickmap .leaflet-tile{visibility:visible!important;opacity:1!important}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3)}
.sheet .sh h2{font-size:17px;font-weight:600}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:11px var(--s3);font-size:15px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:var(--rf);background:var(--surface-2);border:1px solid var(--border);font-size:13px}
.seg button.sel{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn{padding:12px var(--s4);border-radius:var(--r);font-size:15px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-on)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btnrow{display:flex;gap:var(--s2);margin-top:var(--s4)}
.btnrow .btn{flex:1}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) 0;border-top:1px solid var(--border)}
.setrow:first-child{border-top:none}
.setrow .sl{font-size:14px}
.setrow .sv{font-size:13px;color:var(--text-muted)}
.toggle{width:46px;height:26px;border-radius:var(--rf);background:var(--surface-3);position:relative;flex:none;transition:.2s}
.toggle>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--rf);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--accent)}
.toggle.on>i{left:23px}
</style>
</head>
<body>
<div class="app">

<script>
/* ====== data layer ====== */
const NS='wb_';
const TYPES={todo:'todos',project:'projects',study:'study',money:'money',note:'notes',travel:'travel',journal:'journal',vocab:'vocab',wish:'wishes',reading:'readings'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
function load(t){try{return JSON.parse(localStorage.getItem(NS+t)||'[]')}catch(e){return[]}}
function save(t,a){localStorage.setItem(NS+t,JSON.stringify(a))}
function rec(t,id){return load(t).find(x=>x.id===id)}
function upsert(t,r){const a=load(t),i=a.findIndex(x=>x.id===r.id);r.updatedAt=now();if(i>=0)a[i]=r;else a.push(r);save(t,a);return r}
function del(t,id){save(t,load(t).filter(x=>x.id!==id))}
function settings(){return Object.assign({syncEnabled:false,ghToken:'',ghOwner:'2vg898f7m5-droid',ghRepo:'worktable',supabaseUrl:'',supabaseKey:'',theme:'auto',userId:uid()},JSON.parse(localStorage.getItem(NS+'settings')||'{}'))}
function setSettings(s){localStorage.setItem(NS+'settings',JSON.stringify(s))}

/* ====== sync (GitHub-based) ====== */
const Sync={
  sb:null,lastErr:'',state:'off',
  init(){const s=settings();if(!s.syncEnabled||!s.ghToken){this.sb=null;this.set('off');return Promise.resolve(null)}this.set('ready');return Promise.resolve(true)},
  set(st){this.state=st;const d=document.getElementById('syncdot');if(d)d.className='syncdot'+(st==='ready'?' on':st==='sync'?' sync':st==='err'?' err':'')},
  async push(t,r){const s=settings();if(!s.syncEnabled||!s.ghToken)return;localStorage.setItem('wb_unsynced','1')},
  async remove(t,id){const s=settings();if(!s.syncEnabled||!s.ghToken)return;localStorage.setItem('wb_unsynced','1')},
  async pull(){const s=settings();if(!s.syncEnabled||!s.ghToken)return;const ok=await this.init();if(!ok)return;this.set('sync');try{const r=await fetch(`https://api.github.com/repos/${s.ghOwner}/${s.ghRepo}/contents/sync-data.json`,{headers:{Authorization:`token ${s.ghToken}`,Accept:'application/vnd.github.v3+json'}});if(r.status===404){this.set('ready');return}if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const content=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));const allData=JSON.parse(content);if(allData._deleted){const lt=JSON.parse(localStorage.getItem('wb_deleted')||'[]');allData._deleted.forEach(id=>{if(!lt.includes(id))lt.push(id)});localStorage.setItem('wb_deleted',JSON.stringify(lt))}const tomb=JSON.parse(localStorage.getItem('wb_deleted')||'[]');let ch=false;for(const [type,lsKey]of Object.entries(TYPES)){if(allData[lsKey]&&Array.isArray(allData[lsKey])){const local=load(lsKey);allData[lsKey].forEach(remote=>{if(tomb.includes(remote.id))return;const i=local.findIndex(x=>x.id===remote.id);if(i>=0){if(new Date(local[i].updatedAt||0)<new Date(remote.updatedAt||0)){local[i]=remote;ch=true}}else{local.push(remote);ch=true}});save(lsKey,local)}}this.set('ready');if(ch)render()}catch(e){this.lastErr='pull:'+e.message;this.set('err')}},
  async diag(){const s=settings();let log=[];log.push('同步:'+s.syncEnabled);log.push('GitHub:'+(s.ghOwner||'?')+'/'+(s.ghRepo||'?'));log.push('Token:'+(s.ghToken?'已配置':'未配置'));log.push('UserID:'+s.userId);log.push('未同步:'+(localStorage.getItem('wb_unsynced')?'有未推送更改':'无'));if(!s.syncEnabled||!s.ghToken){return log.join('\n')}await this.init();log.push('连接:'+(this.state==='ready'?'成功':'失败'));try{const r=await fetch(`https://api.github.com/repos/${s.ghOwner}/${s.ghRepo}/contents/sync-data.json`,{headers:{Authorization:`token ${s.ghToken}`,Accept:'application/vnd.github.v3+json'}});if(r.status===404){log.push('云端文件:不存在（需先推送）')}else if(r.ok){const data=await r.json();const content=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));const allData=JSON.parse(content);let total=0;for(const [type,lsKey]of Object.entries(TYPES)){if(allData[lsKey])total+=allData[lsKey].length}log.push('云端记录数:'+total);log.push('最后更新:'+data.updated_at)}else{log.push('查询错误:HTTP '+r.status)}}catch(e){log.push('查询异常:'+e.message)}if(this.lastErr)log.push('最后错误:'+this.lastErr);return log.join('\n')}
};

/* ====== icons ====== */

  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H10a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V10a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>',
  chek:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>',
  wish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.3 5.7.4-4.4 3.7 1.4 5.5L12 15.2 7.2 18.4l1.4-5.5-4.4-3.7 5.7-.4z"/></svg>',
  catExp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5L12 12M9.5 14.5L12 12m0 0l-2.5 2.5M12 12l2.5-2.5"/></svg>',
  catSkill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13M4 19h16M8 8h8M8 12h6"/></svg>',
  catTravel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l6-3 6 3 6-3v7l-6 3-6-3-6 3z"/></svg>',
  catCollect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M12 21V9"/></svg>',
  catOther:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  check2:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>',
  ringDone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};
const TABS=[
  {k:'home',label:'Home',icon:IC.home},
  {k:'todo',label:'Todo',icon:IC.todo},
  {k:'project',label:'Project',icon:IC.proj},
  {k:'study',label:'Study',icon:IC.study},
  {k:'money',label:'Money',icon:IC.money},
  {k:'reading',label:'Reading',icon:IC.book},
  {k:'note',label:'Idea',icon:IC.idea},
  {k:'travel',label:'Travel',icon:IC.travel},
  {k:'journal',label:'Journal',icon:IC.journal},
  {k:'wish',label:'Wish',icon:IC.wish}
];

/* ====== navigation ====== */
let cur='home';
function buildNav(){const rail=document.getElementById('navrail');rail.innerHTML='';TABS.forEach(t=>{const b=document.createElement('button');b.className='navitem'+(t.k===cur?' active':'');b.innerHTML=t.icon+'<span>'+t.label+'</span>';b.onclick=()=>go(t.k);rail.appendChild(b)});const sp=document.createElement('div');sp.className='spacer';rail.appendChild(sp);const set=document.createElement('button');set.className='navitem';set.innerHTML=IC.gear+'<span>Setup</span>';set.onclick=openSettings;rail.appendChild(set)}
function go(k){cur=k;buildNav();render();document.getElementById('content').scrollTop=0}

/* ====== render ====== */
function render(){
  const main=document.getElementById('main');
  if(cur==='note')main.classList.add('idea-mode');else main.classList.remove('idea-mode');
  document.getElementById('content').innerHTML='<div class="view active">'+renderView(cur)+'</div>';
  afterRender();
}
function renderView(k){
  if(k==='home')return viewHome();
  if(k==='todo')return viewTodo();
  if(k==='project')return viewProject();
  if(k==='study')return viewStudy();
  if(k==='money')return viewMoney();
  if(k==='reading')return viewReading();
  if(k==='note')return viewNote();
  if(k==='travel')return viewTravel();
  if(k==='journal')return viewJournal();
  if(k==='wish')return viewWish();
  if(k==='travelDetail')return viewTravelDetail();
  if(k==='journalEdit')return viewJournalEdit();
  if(k==='vocab')return viewVocab();
}
function money(n){return'¥'+Number(n||0).toLocaleString()}
function pagehead(title,sub,addType,addClass,extra){return`<div class="pagehead"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div style="display:flex;gap:var(--s2)">${extra||''}<button class="btn ${addClass||'primary'}" style="padding:8px 16px" onclick="openAdd('${addType}')">+ New</button></div></div>`}
function section(t){return`<div class="section-title">${t}</div>`}
function empty(t,sub){return`<div class="empty">${IC.idea}<p>${t}</p><p style="font-size:12px">${sub||''}</p></div>`}
function emptyS(t){return`<div style="text-align:center;padding:var(--s4);color:var(--text-faint);font-size:13px">${t}</div>`}

/* ====== Home: calendar + today ====== */
let calDate=new Date(),calSelDate=new Date();
function viewHome(){
  const todos=load('todos'),projs=load('projects'),study=load('study'),journals=load('journal');
  const todayStr=fmtISO(new Date());
  const td=todos.filter(t=>!t.done&&(t.due===todayStr||isToday(t.due))).sort((a,b)=>(a.due||'z').localeCompare(b.due||'z'));
  const execTodos=getExecTodosForDate(todayStr);
  const active=projs.filter(p=>p.status!=='done');
  let s=pagehead('Home','今日议程','todos','ghost');
  s+=renderCalendar();
  s+=section('Today');
  if(!td.length&&!execTodos.length)s+=emptyS('今天没有待办');
  else{s+='<div class="list">';td.forEach(t=>s+=todoRow(t));execTodos.forEach(t=>s+=execTodoRow(t));s+='</div>'}
  s+=section('Projects');if(!active.length)s+=emptyS('暂无进行中的项目');else active.slice(0,2).forEach(p=>s+=projCard(p,true));
  s+=section('Study');const bigStudy=study.filter(p=>!p.parentId);if(!bigStudy.length)s+=emptyS('暂无学习计划');else bigStudy.forEach(p=>s+=studyMini(p));
  return s;
}
function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1),firstDay=first.getDay(),daysInM=new Date(y,m+1,0).getDate();
  const today=new Date(),todayStr=fmtISO(today);
  const selStr=fmtISO(calSelDate);
  const todos=load('todos'),journals=load('journal');
  const execPlans=load('study').filter(p=>p.isExec&&p.dailyGoal);
  const eventDates=new Set();
  todos.forEach(t=>{if(t.due)eventDates.add(t.due)});
  journals.forEach(j=>{if(j.date)eventDates.add(j.date)});
  // execution plan dates: show dot on every day that has an uncompleted exec todo
  execPlans.forEach(p=>{
    for(let d=1;d<=daysInM;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(!p.completions||!p.completions[ds])eventDates.add(ds);
    }
  });
  let s=`<div class="cal"><div class="cal-head"><b>${y}年${m+1}月</b><div class="cal-nav"><button onclick="calPrev()">${IC.back}</button><button onclick="calNext()" style="transform:rotate(180deg)">${IC.back}</button></div></div><div class="cal-grid">`;
  ['日','一','二','三','四','五','六'].forEach(d=>s+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<firstDay;i++)s+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInM;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr,isSel=ds===selStr,hasEvt=eventDates.has(ds);
    s+=`<div class="cal-day ${isToday?'today':''} ${isSel&&!isToday?'sel':''}" onclick="calPick('${ds}')">${d}${hasEvt?'<div class="dot"></div>':''}</div>`;
  }
  s+='</div>';
  // selected date items
  const selEvts=todos.filter(t=>t.due===selStr);
  const selJrnl=journals.filter(j=>j.date===fmtISO(calSelDate));
  const selExec=getExecTodosForDate(selStr);
  if(selEvts.length||selJrnl.length||selExec.length){
    s+=`<div style="margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border)"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${calSelDate.getMonth()+1}月${calSelDate.getDate()}日</div>`;
    selEvts.forEach(t=>s+=`<div style="font-size:13px;padding:3px 0;cursor:pointer" onclick="toggleTodo('${t.id}')">☐ ${esc(t.title)}</div>`);
    selExec.forEach(t=>s+=`<div style="font-size:13px;padding:3px 0;cursor:pointer" onclick="toggleExecTodo('${t.planId}','${t.dateStr}')">${t.done?'☑':'☐'} ${esc(t.title)} <span style="font-size:11px;color:var(--text-faint)">(每日)</span></div>`);
    selJrnl.forEach(j=>s+=`<div style="font-size:13px;padding:3px 0">📓 ${esc(j.title||'日记')}</div>`);
    s+='</div>';
  }
  s+='</div>';
  return s;
}

/* ====== Project: checkbox items + item expenses ====== */
function projCard(p,mini){
  const sp=spent(p),rem=Number(p.budget||0)-sp,bpct=p.budget&&p.budgetMode==='budget'?Math.round(sp/p.budget*100):0,pp=progPct(p);
  const bMode=p.budgetMode||'expense';
  const collapsed=isCollapsed(p.id);
  let s=`<div class="proj ${collapsed?'collapsed':''}"><div class="ph" onclick="toggleCollapse('${p.id}')"><div class="proj-toggle">${IC.chevron}</div><div style="flex:1;min-width:0"><div class="pname">${esc(p.name)}</div>${p.note?`<div class="pnote">${esc(p.note)}</div>`:''}</div>`;
  if(bMode==='budget'&&p.budget){
    s+=`<div class="spent">${money(sp)}<small> / ${money(p.budget)}</small></div></div>`;
    s+=`<div class="pbar"><i style="width:${bpct}%"></i></div><div class="pstat"><span>已用 ${bpct}% · 剩 ${money(rem)}</span><span>进度 ${pp}%</span></div>`;
  } else {
    s+=`<div class="spent">${money(sp)}<small> 花销</small></div></div>`;
    s+=`<div class="pstat"><span>进度 ${pp}%</span></div>`;
  }
  if(!mini){
    const stages=p.stages||[];
    const allItems=p.items||[];
    const allFiles=p.attachments||[];
    /* SVG flow chart */
    s+=`<div class="proj-flow"><div class="et"><span>流程图 (${stages.length})</span><button class="pill soft" onclick="addStage('${p.id}')">+ 流程</button></div>`;
    if(stages.length){s+=renderFlowChart(p)}else{s+='<div style="color:var(--text-faint);font-size:12px;padding:4px 0">输入整体流程（如：报名 准备材料 入库 面签），自动拆分为阶段</div>'}
    s+='</div>';
    /* stage sections — group items & files by stage */
    if(stages.length){
      stages.forEach(stg=>{
        const st=stg.status||'pending';
        const dotCls=st==='done'?'s-done':st==='progress'?'s-progress':'s-pending';
        const si=allItems.filter(it=>it.stageId===stg.id);
        const sf=allFiles.filter(f=>f.stageId===stg.id);
        const stgExpTotal=(stg.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
        s+=`<div class="stage-sec">`;
        s+=`<div class="stage-sec-hd"><span class="stage-dot ${dotCls}"></span><span class="stage-sec-name">${esc(stg.name)}</span><span class="stage-sec-meta">${si.length}项 · ${sf.length}资料${stgExpTotal?' · '+money(stgExpTotal):''}</span></div>`;
        s+=`<input type="file" id="fileinput_${stg.id}" style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" onchange="handleFileUpload('${p.id}','${stg.id}',this.files[0])">`;
        s+=`<div class="stage-sec-body">`;
        si.forEach(it=>{
          const itExp=(it.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0)+(it.amount||0);
          s+=`<div class="item-block ${it.done?'done':''}">`;
          s+=`<div class="itemrow ${it.done?'done':''}"><div class="ichk" onclick="event.stopPropagation();toggleItem('${p.id}','${it.id}')">${IC.chek}</div><div class="iname" onclick="editItem('${p.id}','${it.id}')">${esc(it.title)}</div>${itExp?`<div class="iamt">${money(itExp)}</div>`:''}<button class="item-add-exp" onclick="event.stopPropagation();addItemExpenseInline('${p.id}','${it.id}')">+</button></div>`;
          if(it.expenses&&it.expenses.length){s+='<div class="item-exps">';it.expenses.forEach(e=>{s+=`<div class="exprow"><span class="eamt">${money(e.amount)}</span><span class="ecat">${esc(e.note||e.category||'')} · ${fmtDate(e.date||'')}</span><button class="edel" onclick="event.stopPropagation();delItemExpenseInline('${p.id}','${it.id}','${e.id}')">删除</button></div>`});s+='</div>'}
          s+='</div>';
        });
        if(sf.length){s+='<div class="file-grid" style="margin-top:4px">';sf.forEach(f=>{const isImg=f.type==='image';s+=`<div class="file-card" onclick="viewAttachment('${p.id}','${f.id}')">`;s+=isImg?`<div class="file-thumb"><img src="${f.data}" alt=""></div>`:`<div class="file-thumb">${IC.file}</div>`;s+=`<div class="file-name">${esc(f.name)}</div>`;s+=`<div class="file-del" onclick="event.stopPropagation();delAttachment('${p.id}','${f.id}')">✕</div>`;s+='</div>'});s+='</div>'}
        if(stg.expenses&&stg.expenses.length){s+='<div class="item-exps">';stg.expenses.forEach(e=>{s+=`<div class="exprow"><span class="eamt">${money(e.amount)}</span><span class="ecat">${esc(e.note||'')} · ${fmtDate(e.date||'')}</span><button class="edel" onclick="event.stopPropagation();delStageExpense('${p.id}','${stg.id}','${e.id}')">删除</button></div>`});s+='</div>'}
        if(!si.length&&!sf.length&&!(stg.expenses&&stg.expenses.length)){s+='<div style="color:var(--text-faint);font-size:12px;padding:2px 0">添加小项、记录花费或上传资料</div>'}
        s+='</div>';
        s+=`<div class="stage-sec-add"><button onclick="addItem('${p.id}','${stg.id}')">+ 小项</button><button onclick="addStageExpense('${p.id}','${stg.id}')">💰 花费</button><button onclick="document.getElementById('fileinput_${stg.id}').click()">📎 上传资料</button></div>`;
        s+='</div>';
      });
    }
    /* unfiled section — items/files not linked to any stage */
    const unItems=allItems.filter(it=>!it.stageId||!stages.find(x=>x.id===it.stageId));
    const unFiles=allFiles.filter(f=>!f.stageId||!stages.find(x=>x.id===f.stageId));
    if(unItems.length||unFiles.length||!stages.length){
      if(stages.length){s+=`<div class="stage-sec"><div class="stage-sec-hd"><span class="stage-dot s-pending"></span><span class="stage-sec-name">未分类</span><span class="stage-sec-meta">${unItems.length}项 · ${unFiles.length}资料</span></div>`;s+=`<input type="file" id="fileinput_unfiled_${p.id}" style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" onchange="handleFileUpload('${p.id}',null,this.files[0])"><div class="stage-sec-body">`}
      unItems.forEach(it=>{
        const itExp=(it.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0)+(it.amount||0);
        s+=`<div class="item-block ${it.done?'done':''}">`;
        s+=`<div class="itemrow ${it.done?'done':''}"><div class="ichk" onclick="event.stopPropagation();toggleItem('${p.id}','${it.id}')">${IC.chek}</div><div class="iname" onclick="editItem('${p.id}','${it.id}')">${esc(it.title)}</div>${itExp?`<div class="iamt">${money(itExp)}</div>`:''}<button class="item-add-exp" onclick="event.stopPropagation();addItemExpenseInline('${p.id}','${it.id}')">+</button></div>`;
        if(it.expenses&&it.expenses.length){s+='<div class="item-exps">';it.expenses.forEach(e=>{s+=`<div class="exprow"><span class="eamt">${money(e.amount)}</span><span class="ecat">${esc(e.note||e.category||'')} · ${fmtDate(e.date||'')}</span><button class="edel" onclick="event.stopPropagation();delItemExpenseInline('${p.id}','${it.id}','${e.id}')">删除</button></div>`});s+='</div>'}
        s+='</div>';
      });
      if(unFiles.length){s+='<div class="file-grid" style="margin-top:4px">';unFiles.forEach(f=>{const isImg=f.type==='image';s+=`<div class="file-card" onclick="viewAttachment('${p.id}','${f.id}')">`;s+=isImg?`<div class="file-thumb"><img src="${f.data}" alt=""></div>`:`<div class="file-thumb">${IC.file}</div>`;s+=`<div class="file-name">${esc(f.name)}</div>`;s+=`<div class="file-del" onclick="event.stopPropagation();delAttachment('${p.id}','${f.id}')">✕</div>`;s+='</div>'});s+='</div>'}
      if(stages.length){s+=`</div><div class="stage-sec-add"><button onclick="addItem('${p.id}',null)">+ 小项</button><button onclick="document.getElementById('fileinput_unfiled_${p.id}').click()">📎 上传资料</button></div></div>`}
    }
    s+=`<div class="btnrow" style="margin-top:var(--s3)"><button class="btn ghost" onclick="editRec('projects','${p.id}')">编辑项目</button></div>`;
  }
  s+='</div>';return s;
}
function viewTodo(){const todos=load('todos').sort((a,b)=>(a.done-b.done)||(a.due||'z').localeCompare(b.due||'z'));const todayStr=fmtISO(new Date());const execTodos=getExecTodosForDate(todayStr);let s=pagehead('Todo',todos.filter(t=>!t.done).length+execTodos.filter(t=>!t.done).length+' 项未完成','todos');const done=todos.filter(t=>t.done),undone=todos.filter(t=>!t.done);const execUndone=execTodos.filter(t=>!t.done),execDone=execTodos.filter(t=>t.done);if(undone.length||execUndone.length){s+='<div class="list">';undone.forEach(t=>s+=todoRow(t));execUndone.forEach(t=>s+=execTodoRow(t));s+='</div>'}if(done.length||execDone.length){s+=section('已完成');s+='<div class="list">';done.forEach(t=>s+=todoRow(t));execDone.forEach(t=>s+=execTodoRow(t));s+='</div>'}if(!todos.length&&!execTodos.length)s+=empty('还没有待办','点 + New 新建第一条');return s}
function viewProject(){const projs=load('projects');let s=pagehead('Project',projs.filter(p=>p.status!=='done').length+' 进行中','projects');const act=projs.filter(p=>p.status!=='done'),fin=projs.filter(p=>p.status==='done');if(act.length)act.forEach(p=>s+=projCard(p,false));if(fin.length){s+=section('已完成');fin.forEach(p=>s+=projCard(p,false))}if(!projs.length)s+=empty('还没有项目','新建项目并记录花销');return s}

/* ====== Study: three-level plans + vocab ====== */
function viewStudy(){
  const st=load('study');
  let s=pagehead('Study',st.filter(p=>!p.parentId).length+' 个计划','study','primary',`<button class="btn ghost" style="padding:8px 16px" onclick="openAdd('vocab')">单词</button>`);
  const bigPlans=st.filter(p=>!p.parentId);
  if(bigPlans.length){
    bigPlans.forEach(p=>{
    const pct=progPct(p),children=st.filter(c=>c.parentId===p.id);
    const dateStr=p.startDate?fmtDate(p.startDate):'';
    s+=`<div class="proj" onclick="editRec('study','${p.id}')"><div class="ph"><div><div class="pname">${esc(p.title)}</div>${dateStr||p.note?`<div class="pnote">${dateStr?'📅 '+dateStr:''}${p.note?' · '+esc(p.note):''}</div>`:''}</div><span class="pct">${pct}%</span></div><div class="pbar"><i style="width:${pct}%"></i></div>`;
    if(children.length){
      s+=`<div class="items"><div class="et"><span>子计划 (${children.length})</span><button class="pill soft" onclick="event.stopPropagation();addSubPlan('${p.id}')">+ 子计划</button></div>`;
      children.forEach(c=>{
        const cpct=progPct(c),cExec=st.filter(e=>e.parentId===c.id);
        const cMs=c.milestones||[];
        const msDone=cMs.filter(m=>(m.target!=null&&m.target>0)?(m.current||0)>=m.target:m.done).length;
        const msBadge=cMs.length?`<span class="pill muted">🎯 ${msDone}/${cMs.length}</span>`:'';
        const cTargetBadge=(c.target!=null&&c.target>0)?`<span class="pill muted">${c.current||0}/${c.target}${esc(c.unit||'')}</span>`:'';
        s+=`<div class="itemrow ${cpct>=100?'done':''}" onclick="event.stopPropagation();editRec('study','${c.id}')"><div class="ichk" style="${cpct>=100?'background:var(--accent);border-color:var(--accent)':''}">${IC.chek}</div><div class="iname">${esc(c.title)}</div>${cTargetBadge}${msBadge}${cExec.length?`<span class="pill muted">${cExec.length} 执行</span>`:''}<button class="pill soft" style="font-size:10px" onclick="event.stopPropagation();addSubPlan('${c.id}')">+ 执行</button><span class="pct">${cpct}%</span></div>`;
        cMs.forEach(m=>{
          const mHasT=m.target!=null&&m.target>0;
          const mCur=m.current||0;
          const mPct=mHasT?Math.min(100,Math.round(mCur/m.target*100)):0;
          const mDone=mHasT?mCur>=m.target:m.done;
          if(mHasT){
            s+=`<div class="ms-row ${mDone?'done':''}" style="margin-left:24px" onclick="event.stopPropagation();editRec('study','${c.id}')"><span class="ms-date">${m.date?fmtDate(m.date):'无日期'}</span><span class="ms-title">${esc(m.title)}</span><div style="margin-left:auto;display:flex;align-items:center;gap:4px;flex:none"><div class="pbar" style="width:40px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden"><i style="width:${mPct}%;height:100%;background:${mDone?'var(--success)':'var(--accent)'};display:block"></i></div><span style="font-size:11px;color:var(--text-muted);white-space:nowrap">${mCur}/${m.target}${esc(m.unit||'')}</span></div></div>`;
          } else {
            s+=`<div class="ms-row ${mDone?'done':''}" style="margin-left:24px" onclick="event.stopPropagation();editRec('study','${c.id}')"><div class="ms-chk" style="${mDone?'background:var(--accent);border-color:var(--accent)':''}">${IC.chek}</div><span class="ms-date">${m.date?fmtDate(m.date):'无日期'}</span><span class="ms-title">${esc(m.title)}</span></div>`;
          }
        });
        cExec.forEach(e=>{
          const epct=progPct(e);
          const esch=e.schedule||{};
          let elabel='';
          if(!esch.type||esch.type==='daily')elabel=e.dailyGoal?(' · 每日'+e.dailyGoal):' · 每日';
          else if(esch.type==='everyNdays')elabel=' · 每'+(esch.n||2)+'天';
          else if(esch.type==='weekly')elabel=' · 每周';
          s+=`<div class="itemrow ${epct>=100?'done':''}" style="margin-left:24px" onclick="event.stopPropagation();editRec('study','${e.id}')"><div class="ichk" style="${epct>=100?'background:var(--accent);border-color:var(--accent)':''}">${IC.chek}</div><div class="iname" style="font-size:12.5px;color:var(--text-muted)">${esc(e.title)}${elabel}</div><span class="pct" style="font-size:12px">${epct}%</span></div>`;
        });
      });
      s+='</div>';
    } else {
      s+=`<div class="btnrow" style="margin-top:var(--s3)"><button class="btn ghost" onclick="event.stopPropagation();addSubPlan('${p.id}')">+ 子计划</button>${p.totalWeeks?`<button class="btn ghost" onclick="event.stopPropagation();advanceWeek('${p.id}')">+1 周</button>`:''}</div>`;
    }
    s+='</div>';
    });
  } else {
    s+=emptyS('暂无学习计划 · + New 新建');
  }
  // Vocab section
  const lists=load('vocab');
  s+=section('背单词');
  if(!lists.length){
    s+=emptyS('暂无词表 · 点「单词」导入');
  } else {
    const totalWords=lists.reduce((s,l)=>s+(l.words||[]).length,0);
    const totalLearned=lists.reduce((s,l)=>s+(l.words||[]).filter(w=>w.learned).length,0);
    s+='<div class="vocab-stats">';
    s+=`<div class="vocab-stat"><div class="vs-val">${lists.length}</div><div class="vs-lbl">词表</div></div>`;
    s+=`<div class="vocab-stat"><div class="vs-val">${totalWords}</div><div class="vs-lbl">总单词</div></div>`;
    s+=`<div class="vocab-stat"><div class="vs-val">${totalLearned}</div><div class="vs-lbl">已掌握</div></div>`;
    s+='</div>';
    lists.forEach(l=>{
      const learned=(l.words||[]).filter(w=>w.learned).length;
      const total=(l.words||[]).length;
      const pct=total?Math.round(learned/total*100):0;
      s+=`<div class="row" onclick="vocabStudyId='${l.id}';go('vocab')"><div class="rmain"><div class="rtitle">${esc(l.title)}</div><div class="rmeta"><span>${total} 词</span><span>· 已掌握 ${learned}</span></div></div><button class="pill muted" style="cursor:pointer;flex:none" onclick="event.stopPropagation();editRec('vocab','${l.id}')">编辑</button><div class="pbar" style="width:50px"><i style="width:${pct}%"></i></div><span class="pct">${pct}%</span></div>`;
    });
  }
  return s;
}

/* ====== Money: income + invest + monthly stats ====== */
let moneyYear=null;
function viewMoney(){
  const m=load('money');
  let s=pagehead('Money',m.length+' 项记录','money');
  if(!m.length)return s+empty('还没有记录','记录收入来源和投资行为');
  const years=[...new Set(m.map(x=>(x.date||fmtISO(new Date())).slice(0,4)))].sort().reverse();
  const curYear=moneyYear||years[0]||String(new Date().getFullYear());
  moneyYear=curYear;
  s+=`<div class="year-sel">`;
  years.forEach(y=>s+=`<button class="year-btn ${y===curYear?'active':''}" onclick="moneyYear='${y}';render()">${y}</button>`);
  s+='</div>';
  const yd=m.filter(x=>(x.date||fmtISO(new Date())).startsWith(curYear));
  const income=yd.filter(x=>x.kind==='income');
  const invest=yd.filter(x=>x.kind==='invest');
  const totalIn=income.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalInv=invest.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalRet=invest.reduce((s,x)=>s+Number(x.returned||0),0);
  const net=totalIn+totalRet-totalInv;
  s+='<div class="money-compact">';

function moneyStatsDetail(curYear){
  const m=load('money');

  const income=yd.filter(x=>x.kind==='income');
  const invest=yd.filter(x=>x.kind==='invest');
  const totalIn=income.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalInv=invest.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalRet=invest.reduce((s,x)=>s+Number(x.returned||0),0);
  let body=`<div class="sh"><h2>${curYear} 年度统计</h2><button onclick="closeModal()">${IC.back}</button></div>`;

    body+='<div class="flow-bar">';

    body+='</div></div>';
  }
  body+=section('月度统计');
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const monthly=months.map((mth,i)=>{
    const ms=curYear+'-'+String(i+1).padStart(2,'0');
    const mi=income.filter(x=>(x.date||'').startsWith(ms)).reduce((s,x)=>s+Number(x.amount||0),0);
    const mv=invest.filter(x=>(x.date||'').startsWith(ms)).reduce((s,x)=>s+Number(x.amount||0),0);
    return{m:mth,mi,mv};

  const maxM=Math.max(...monthly.map(d=>d.mi+d.mv),1);

    if(d.mv)body+=`<i class="mb-inv" style="width:${vPct}%"></i>`;
    body+=`</div>`;

  body+='</div>';
  const incCats={};
  income.forEach(x=>{const c=x.type||'其他';if(!incCats[c])incCats[c]=0;incCats[c]+=Number(x.amount||0)});
  if(Object.keys(incCats).length){
    body+=section('收入分类');
    const incColors={'工资':'#6B7B4A','兼职':'#7A8B5A','奖金':'#8B7355','投资收益':'#9B8060','其他':'#8A7866'};
    const maxInc=Math.max(...Object.values(incCats),1);
    Object.entries(incCats).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
      const color=incColors[cat]||'#8A7866';
      const pct=Math.round(amt/maxInc*100);

function layoutBubbles(){
  const canvas=document.getElementById('bubbleCanvas');if(!canvas)return;
  const notes=load('notes').sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  canvas.querySelectorAll('.g-bubble').forEach(b=>b.remove());
  const cw=canvas.offsetWidth,ch=Math.max(window.innerHeight-100,notes.length*90+200);
  canvas.style.minHeight=ch+'px';
  const placed=[];
  const sizes=[
    {w:140,h:125,pad:22},{w:118,h:105,pad:20},{w:98,h:88,pad:18},{w:82,h:74,pad:15},{w:70,h:62,pad:13}
  ];
  notes.forEach((note)=>{
    const txt=(note.title||note.content||'无标题').slice(0,20);
    const len=(note.content||note.title||'').length;
    const si=len>100?0:len>50?1:len>20?2:len>10?3:4;
    const sz=sizes[Math.min(si,sizes.length-1)];
    let x,y,ok=false,attempts=0;
    while(!ok&&attempts<50){
      x=Math.random()*(cw-sz.w-20)+10;
      y=Math.random()*(ch-sz.h-20)+10;
      ok=true;
      for(const p of placed){if(Math.abs(x-p.x)<sz.w+p.pad&&Math.abs(y-p.y)<sz.h+p.pad){ok=false;break}}
      attempts++;
    }
    placed.push({x,y,w:sz.w,h:sz.h});
    const el=document.createElement('div');
    el.className='g-bubble glass';
    el.style.cssText=`left:${x}px;top:${y}px;width:${sz.w}px;height:${sz.h}px;font-size:${13-Math.min(si,4)}px`;
    el.textContent=txt;
    el.onclick=()=>editRec('notes',note.id);
    canvas.appendChild(el);
  });
}

function renderRouteSVG(trips){
  const year=new Date().getFullYear();
  const yt=trips.filter(t=>t.start&&t.start.startsWith(year)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(yt.length<2)return'';
  const w=320,h=200,pad=30;
  const minX=Math.min(...yt.map(t=>t.lng||0)),maxX=Math.max(...yt.map(t=>t.lng||0));
  const minY=Math.min(...yt.map(t=>t.lat||0)),maxY=Math.max(...yt.map(t=>t.lat||0));
  const rangeX=Math.max(maxX-minX,1),rangeY=Math.max(maxY-minY,1);
  const pts=yt.map(t=>({x:pad+((t.lng||0)-minX)/rangeX*(w-pad*2),y:pad+((t.lat||0)-minY)/rangeY*(h-pad*2),place:t.place||t.title||''}));
  let path=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const p0=pts[i-1],p1=pts[i];
    const cpx=(p0.x+p1.x)/2,cy1=p0.y-Math.abs(p1.x-p0.x)*0.15;
    path+=` Q ${cpx} ${cy1} ${p1.x} ${p1.y}`;
  }
  let s=`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${year}年路线图</div>`;
  s+=`<svg class="route-svg" viewBox="0 0 ${w} ${h}" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rc)"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".6"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)"/><text x="${p.x+6}" y="${p.y-6}" font-size="9" fill="var(--text-muted)">${esc(p.place.slice(0,6))}</text>`;
  });
  s+='</svg>';
  return s;
}
function tripCard(t){
  let s=`<div class="trip" onclick="travelDetailId='${t.id}';go('travelDetail')">`;
  if(t.photos&&t.photos[0])s+=`<img class="tripimg" src="${t.photos[0]}" alt="">`;
  else s+=`<div class="tripimg" style="display:flex;align-items:center;justify-content:center">${IC.travel}</div>`;
  s+=`<div class="tripbody"><div class="tripplace">${esc(t.place||t.title||'未命名')}</div>`;
  if(t.start||t.end)s+=`<div class="tripdate">${fmtDate(t.start)}${t.end?' — '+fmtDate(t.end):''}</div>`;
  if(t.method)s+=`<div class="tripmethod">${t.method}</div>`;
  if(t.note)s+=`<div class="tripnote">${esc(t.note)}</div>`;
  if(t.photos&&t.photos.length)s+=`<div class="tripnote">${t.photos.length} 张照片</div>`;
  s+='</div></div>';return s;
}

function viewJournal(){const j=load('journal').sort((a,b)=>(b.date||'').localeCompare(a.date||''));let s=pagehead('Journal',j.length+' 篇','journal');if(!j.length)return s+empty('还没有日记','记录你的思考和心情');j.forEach(x=>s+=`<div class="journal-card" onclick="journalEditId='${x.id}';go('journalEdit')"><div class="jh"><span class="jdate">${fmtDate(x.date)}</span><span class="jmood">${esc(x.mood||'📝')}</span></div>${x.title?`<div class="jtitle">${esc(x.title)}</div>`:''}<div class="jbody">${esc(x.content||'')}</div></div>`);return s}
function viewJournalEdit(){
  const r=journalEditId?rec('journal',journalEditId):{};
  currentMood=r.mood||'📝';
  let s=`<div class="pagehead"><button class="btn ghost" style="padding:8px 16px" onclick="go('journal')">${IC.back} 返回</button><div class="spacer"></div><button class="btn primary" style="padding:8px 16px" onclick="saveJournalPage()">保存</button></div>`;
  s+='<div class="journal-editor">';
  s+=`<div class="je-header"><input type="date" id="j_date" value="${r.date||fmtISO(new Date())}" style="background:none;border:none;text-align:center;font-size:13px;color:var(--text-muted);font-family:var(--font);outline:none;width:auto"></div>`;
  s+=`<input class="je-title" id="j_title" value="${esc(r.title||'')}" placeholder="今天的小标题...">`;
  const moods=[{e:'📝',l:'平静'},{e:'😊',l:'开心'},{e:'🤔',l:'思考'},{e:'😴',l:'疲惫'},{e:'🔥',l:'兴奋'},{e:'🌧️',l:'低落'},{e:'✨',l:'灵感'},{e:'🌙',l:'夜深'}];
  s+='<div class="journal-mood-row">';
  moods.forEach(m=>{
    s+=`<div class="journal-mood ${r.mood===m.e?'sel':''}" data-mood="${m.e}" onclick="pickMood(this,'${m.e}')" title="${m.l}">${m.e}</div>`;
  });
  s+='</div>';
  s+=`<textarea class="je-body" id="j_content" placeholder="写下今天的故事..." oninput="updateWordCount()">${esc(r.content||'')}</textarea>`;
  s+=`<div class="je-toolbar"><span style="font-size:12px;color:var(--text-muted)" id="jwc">0 字</span>${journalEditId?`<button class="btn danger" style="padding:6px 14px;font-size:13px" onclick="delJournalPage()">删除</button>`:''}</div>`;
  s+='</div>';
