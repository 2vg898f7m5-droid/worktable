}
function pickMood(el,mood){currentMood=mood;document.querySelectorAll('.journal-mood').forEach(m=>m.classList.toggle('sel',m.dataset.mood===mood))}
function updateWordCount(){const c=document.getElementById('j_content');const w=document.getElementById('jwc');if(c&&w){const n=(c.value||'').length;w.textContent=n+' 字'}}
function saveJournalPage(){const r={id:journalEditId||uid(),date:val('j_date')||fmtISO(new Date()),title:val('j_title'),mood:currentMood,content:val('j_content')};upsert('journal',r);Sync.push('journal',r);go('journal')}
function delJournalPage(){if(!confirm('确定删除这篇日记?'))return;del('journal',journalEditId);Sync.remove('journal',journalEditId);go('journal')}

/* ====== Wish: wish list ====== */
let wishFilter='all';
const wishCats=[{k:'体验',icon:'catExp'},{k:'技能',icon:'catSkill'},{k:'旅行',icon:'catTravel'},{k:'收藏',icon:'catCollect'},{k:'其他',icon:'catOther'}];
const wishQuotes=['种一棵树最好的时间是十年前，其次是现在。','不要等待，时机永远不会恰到好处。','你唯一需要害怕的，是害怕本身。','千里之行，始于足下。','梦想不会自己实现，但每一步都在靠近。','今天的你，是昨天的你向往的未来。'];
function viewWish(){
  const w=load('wishes').sort((a,b)=>(a.done-b.done)||((b.date||'').localeCompare(a.date||'')));
  const total=w.length,done=w.filter(x=>x.done).length,pending=total-done;
  const pct=total?Math.round(done/total*100):0;
  const circ=2*Math.PI*28;
  const dashOff=circ*(1-pct/100);
  const totalBudget=w.reduce((s,x)=>s+Number(x.budget||0),0);
  const totalSpent=w.reduce((s,x)=>s+wishSpent(x),0);
  let s=pagehead('Wish',pending+' 想做','wishes');
  if(!w.length)return s+empty('愿望清单空空','添加你想尝试的事情 — 体验、技能、旅行、收藏，一切从此开始');
  s+=`<div class="wish-hero"><div class="wh-ring"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--border)" stroke-width="4"/><circle cx="32" cy="32" r="28" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${dashOff}"/></svg><div class="wh-pct">${pct}%</div></div><div class="wh-label">实现进度</div><div class="wh-stats"><div class="wh-stat"><div class="ws-num">${total}</div><div class="ws-lbl">总愿望</div></div><div class="wh-stat"><div class="ws-num" style="color:var(--accent)">${pending}</div><div class="ws-lbl">待实现</div></div><div class="wh-stat"><div class="ws-num" style="color:var(--success)">${done}</div><div class="ws-lbl">已实现</div></div></div>${totalBudget?`<div class="wh-budget"><span>预算 ¥${totalBudget.toFixed(0)}</span><span>已花 ¥${totalSpent.toFixed(0)}</span></div>`:''}</div>`;
  const qi=Math.floor(Math.random()*wishQuotes.length);
  s+=`<div class="wish-quote">${wishQuotes[qi]}</div>`;
  const cats=[{k:'all',label:'全部',icon:'wish'},{k:'done',label:'已完成',icon:'ringDone'},...wishCats];
  s+='<div class="wish-tabs">';
  cats.forEach(c=>{const isAct=wishFilter===c.k;const cnt=c.k==='all'?w.length:c.k==='done'?done:w.filter(x=>(x.category||'体验')===c.k&&!x.done).length;s+=`<button class="wish-tab ${isAct?'active':''}" onclick="wishFilter='${c.k}';render()">${IC[c.icon]||''}<span>${c.label}</span><span style="opacity:.6">${cnt}</span></button>`});
  s+='</div>';
  let filtered=w;
  if(wishFilter==='done')filtered=w.filter(x=>x.done);
  else if(wishFilter!=='all')filtered=w.filter(x=>(x.category||'体验')===wishFilter&&!x.done);
  else filtered=w.filter(x=>!x.done);
  const priColors={dream:'var(--accent)',plan:'var(--accent-text)',soon:'var(--accent-strong)',done:'var(--success)'};
  const priLabels={dream:'梦想',plan:'计划中',soon:'近期',done:'已实现'};
  const catIconMap={'体验':'catExp','技能':'catSkill','旅行':'catTravel','收藏':'catCollect','其他':'catOther'};
  if(filtered.length){
    s+='<div class="wish-grid">';
    filtered.forEach(x=>{
      const pri=x.priority||'dream';
      const priLab=x.done?'done':pri;
      const catKey=x.category||'体验';
      const catIc=catIconMap[catKey]||'catOther';
      const spent=wishSpent(x);const bud=x.budget||0;
      s+=`<div class="wish-card ${x.done?'done':''}" onclick="editRec('wishes','${x.id}')">`;
      s+=`<div class="wcat-bar" style="background:${priColors[priLab]||'var(--accent)'}"></div>`;
      s+=`<div class="wtop"><div class="wicon">${IC[catIc]||IC.catOther}</div><div class="wtitle">${esc(x.title)}</div></div>`;
      if(x.note)s+=`<div class="wnote">${esc(x.note)}</div>`;
      if(bud||spent)s+=`<div class="wbudget"><span class="wb-amt ${spent>bud&&bud>0?'over':''}">¥${spent.toFixed(0)}</span>${bud?`<span class="wb-sep">/</span><span class="wb-budget">¥${bud.toFixed(0)}</span>`:''}${bud>0?`<div class="wb-bar"><div class="wb-fill ${spent>bud?'over':''}" style="width:${Math.min(spent/bud*100,100)}%"></div></div>`:''}</div>`;
      s+='<div class="wmeta">';
      s+=`<span class="wish-cat">${esc(catKey)}</span>`;
      s+=`<span class="wish-pri ${x.done?'done':pri}">${priLabels[priLab]||'梦想'}</span>`;
      if(x.date)s+=`<span style="font-size:11px;color:var(--text-faint)">${fmtDate(x.date)}</span>`;
      s+='</div>';
      if(!x.done)s+=`<button class="wdone-btn" onclick="event.stopPropagation();toggleWishDone('${x.id}')">${IC.check2}</button>`;
      s+='</div>';
    });
    s+='</div>';
  }
  if(wishFilter==='all'&&done>0){
    s+=`<div class="wish-done-section"><div class="wish-done-header">${IC.ringDone} 已实现 ${done} 个愿望</div><div class="wish-grid">`;
    w.filter(x=>x.done).forEach(x=>{
      const catKey=x.category||'体验';
      const catIc=catIconMap[catKey]||'catOther';
      s+=`<div class="wish-card done" onclick="editRec('wishes','${x.id}')">`;
      s+=`<div class="wcat-bar" style="background:var(--success)"></div>`;
      s+=`<div class="wtop"><div class="wicon" style="color:var(--success)">${IC[catIc]||IC.catOther}</div><div class="wtitle">${esc(x.title)}</div></div>`;
      if(x.note)s+=`<div class="wnote">${esc(x.note)}</div>`;
      s+='<div class="wmeta">';
      s+=`<span class="wish-cat">${esc(catKey)}</span>`;
      s+=`<span class="wish-pri done">已实现</span>`;
      if(x.completedAt)s+=`<span style="font-size:11px;color:var(--text-faint)">${fmtDate(x.completedAt)}</span>`;
      else if(x.date)s+=`<span style="font-size:11px;color:var(--text-faint)">${fmtDate(x.date)}</span>`;
      s+='</div></div>';
    });
    s+='</div></div>';
  }
  if(!filtered.length&&wishFilter!=='all')s+=emptyS('该分类暂无愿望');
  return s;
}
function toggleWishDone(id){const w=rec('wishes',id);if(w){w.done=!w.done;w.completedAt=w.done?now():null;upsert('wishes',w);Sync.push('wish',w);render()}}
function saveWish(){const old=editId?rec('wishes',editId):null;const r={id:editId||uid(),title:val('f_title'),category:segVal('f_wcat')||'体验',priority:segVal('f_wpri')||'dream',budget:Number(val('f_budget'))||0,note:val('f_note'),date:val('f_date')||fmtISO(new Date()),done:old?.done||false,completedAt:old?.completedAt||null,expenses:old?.expenses||[]};upsert('wishes',r);Sync.push('wish',r);closeModal();render()}
function wishSpent(x){return(x.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0)}
function wishExpenseSection(r){
  const exps=r.expenses||[];const spent=wishSpent(r);const budget=r.budget||0;
  let s=`<div class="field"><label>花销记录</label>`;
  if(exps.length){
    s+='<div class="wish-exp-list">';
    exps.forEach((e,i)=>{s+=`<div class="wish-exp-item"><div><span class="wish-exp-amt">¥${Number(e.amount||0).toFixed(2)}</span>${e.name?`<span class="wish-exp-name">${esc(e.name)}</span>`:''}${e.date?`<span class="wish-exp-date">${fmtDate(e.date)}</span>`:''}</div><button class="wish-exp-del" onclick="delWishExpense('${r.id}',${i})">${IC.trash}</button></div>`});
    s+='</div>';
  }
  if(budget)s+=`<div class="wish-exp-summary">预算 ¥${budget.toFixed(2)} · 已花 ¥${spent.toFixed(2)} · 剩余 ¥${(budget-spent).toFixed(2)}</div>`;
  s+=`<div class="wish-exp-add"><input id="we_amount" type="number" inputmode="decimal" placeholder="金额" style="width:80px"><input id="we_name" placeholder="名称(如:报名费)" style="flex:1"><input id="we_date" type="date" value="${fmtISO(new Date())}" style="width:130px"><button class="btn primary" onclick="addWishExpense('${r.id}')">添加</button></div>`;
  s+='</div>';return s;
}
function addWishExpense(id){const w=rec('wishes',id);if(!w)return;w.expenses=w.expenses||[];w.expenses.push({amount:Number(val('we_amount'))||0,name:val('we_name'),date:val('we_date')||fmtISO(new Date())});upsert('wishes',w);Sync.push('wish',w);openSheet(formSheet('wishes',w))}
function delWishExpense(id,idx){const w=rec('wishes',id);if(!w||!w.expenses)return;w.expenses.splice(idx,1);upsert('wishes',w);Sync.push('wish',w);openSheet(formSheet('wishes',w))}

/* ====== helpers ====== */
function spent(p){const pe=(p.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);const ie=(p.items||[]).reduce((s,it)=>s+(it.expenses||[]).reduce((se,e)=>se+Number(e.amount||0),0)+(it.amount||0),0);const se=(p.stages||[]).reduce((s,stg)=>s+(stg.expenses||[]).reduce((se2,e)=>se2+Number(e.amount||0),0),0);return pe+ie+se}
function progPct(p){
  if(p.isExec){
    if(!p.completions)return 0;
    let c=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if(p.completions[fmtISO(d)])c++}
    return Math.round(c/7*100);
  }
  const children=load('study').filter(c=>c.parentId===p.id);
  if(children.length)return Math.round(children.reduce((s,c)=>s+progPct(c),0)/children.length);
  if(p.target!=null&&p.target>0)return Math.min(100,Math.round(((p.current||0)/p.target)*100));
  if(p.milestones&&p.milestones.length){const tp=p.milestones.reduce((s,m)=>{if(m.target!=null&&m.target>0)return s+Math.min(1,(m.current||0)/m.target);return s+(m.done?1:0)},0);return Math.round(tp/p.milestones.length*100)}
  if(p.totalWeeks!=null)return Math.min(100,Math.round(((p.currentWeek||0)/(p.totalWeeks||1))*100));
  if(p.items&&p.items.length){const d=p.items.filter(i=>i.done).length;return Math.round(d/p.items.length*100)}
  if(p.progress!=null)return Math.max(0,Math.min(100,Math.round(p.progress)));
  return 0;
}
function isToday(d){try{return new Date(d).toDateString()===new Date().toDateString()}catch(e){return false}}
function fmtISO(d){try{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}catch(e){return''}}
function fmtDate(d){if(!d)return'';try{const x=new Date(d);if(x.toDateString()===new Date().toDateString())return'今天';const y=new Date().getFullYear();return x.getFullYear()===y?(x.getMonth()+1)+'/'+x.getDate():x.getFullYear()+'.'+(x.getMonth()+1)+'.'+x.getDate()}catch(e){return d}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ====== actions ====== */
function isCollapsed(id){try{return JSON.parse(localStorage.getItem('wb_collapsed')||'[]').includes(id)}catch(e){return false}}

function toggleTodo(id){const a=load('todos'),i=a.findIndex(x=>x.id===id);if(i>=0){a[i].done=!a[i].done;a[i].updatedAt=now();save('todos',a);Sync.push('todo',a[i]);render()}}

function advanceWeek(id){const a=load('study'),i=a.findIndex(x=>x.id===id);if(i>=0){a[i].currentWeek=Math.min(a[i].totalWeeks||1,(a[i].currentWeek||0)+1);a[i].updatedAt=now();save('study',a);Sync.push('study',a[i]);render()}}
function delRec(t,id){if(!confirm('确定删除?'))return;const sk=TYPES[t]||t;const tomb=JSON.parse(localStorage.getItem('wb_deleted')||'[]');function addTomb(did){if(!tomb.includes(did))tomb.push(did)}if(sk==='study'){const all=load('study');const toDel=new Set([id]);let ch=true;while(ch){ch=false;all.forEach(p=>{if(p.parentId&&toDel.has(p.parentId)&&!toDel.has(p.id)){toDel.add(p.id);ch=true}})}save('study',all.filter(x=>!toDel.has(x.id)));toDel.forEach(addTomb);toDel.forEach(did=>Sync.remove('study',did))}else{del(sk,id);addTomb(id);Sync.remove(sk,id)}localStorage.setItem('wb_deleted',JSON.stringify(tomb));closeModal();render()}

function addStage(pid){openSheet(`<div class="sh"><h2>添加流程</h2><button onclick="closeModal()">${IC.back}</button></div><div class="field"><label>流程内容</label><textarea id="stg_name" rows="3" placeholder="输入整体流程，自动拆分&#10;如：报名 准备材料 入库 面签&#10;或每行一个阶段"></textarea></div><div class="btnrow"><button class="btn primary" onclick="saveStage('${pid}')">保存</button></div><div style="font-size:11px;color:var(--text-faint);margin-top:var(--s2)">支持逗号、空格、换行分隔，自动拆分为多个阶段</div>`)}
function saveStage(pid){const p=rec('projects',pid);p.stages=p.stages||[];const raw=val('stg_name');const names=raw.split(/[\n,，、\s]+/).map(s=>s.trim()).filter(s=>s.length);if(!names.length)return;names.forEach(n=>p.stages.push({id:uid(),name:n,status:'pending'}));upsert('projects',p);Sync.push('project',p);closeModal();render()}
function cycleStage(pid,sid){const p=rec('projects',pid);const stg=(p.stages||[]).find(x=>x.id===sid);if(!stg)return;const linked=(p.items||[]).filter(it=>it.stageId===sid);if(linked.length)return;const order=['pending','progress','done'];stg.status=order[(order.indexOf(stg.status||'pending')+1)%3];upsert('projects',p);Sync.push('project',p);render()}
function delStage(pid,sid){const p=rec('projects',pid);p.stages=(p.stages||[]).filter(x=>x.id!==sid);(p.items||[]).forEach(it=>{if(it.stageId===sid)it.stageId=null});upsert('projects',p);Sync.push('project',p);render()}
function syncStages(pid){const p=rec('projects',pid);if(!p.stages||!p.stages.length)return;(p.stages).forEach(stg=>{const linked=(p.items||[]).filter(it=>it.stageId===stg.id);if(!linked.length)return;const done=linked.filter(it=>it.done).length;if(done===0)stg.status='pending';else if(done===linked.length)stg.status='done';else stg.status='progress'});upsert('projects',p);Sync.push('project',p)}
function renderFlowChart(p){const stages=p.stages||[];if(!stages.length)return'';const items=p.items||[];const NW=132,NH=58,GAP=28;const totalW=stages.length*(NW+GAP)-GAP;const svgW=Math.max(totalW,200);const FC={done:{f:'#E8E8D5',s:'#6B7B4A',t:'#5A6A3A'},progress:{f:'#F2DDD5',s:'#9B3D2A',t:'#6E2A1A'},pending:{f:'#E8E0CC',s:'rgba(126,104,85,.25)',t:'#7E6855'}};let svg=`<svg viewBox="0 0 ${svgW} ${NH+16}" style="width:100%;max-width:${svgW}px;height:auto;overflow:visible" xmlns="http://www.w3.org/2000/svg">`;svg+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#A89888"/></marker></defs>';stages.forEach((stg,i)=>{const x=i*(NW+GAP),y=8;const st=stg.status||'pending';const c=FC[st]||FC.pending;const linked=items.filter(it=>it.stageId===stg.id);const done=linked.filter(it=>it.done).length;const pct=linked.length?Math.round(done/linked.length*100):(st==='done'?100:0);const isAuto=linked.length>0;if(i<stages.length-1){svg+=`<line x1="${x+NW+2}" y1="${y+NH/2}" x2="${x+NW+GAP-2}" y2="${y+NH/2}" stroke="#A89888" stroke-width="1.5" marker-end="url(#ah)"/>`}svg+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="11" fill="${c.f}" stroke="${c.s}" stroke-width="1.5"/>`;const nm=stg.name.length>9?stg.name.slice(0,8)+'…':stg.name;svg+=`<text x="${x+NW/2}" y="${y+22}" text-anchor="middle" font-size="12" font-weight="600" fill="${c.t}">${esc(nm)}</text>`;if(isAuto){svg+=`<text x="${x+NW/2}" y="${y+40}" text-anchor="middle" font-size="10" fill="${c.t}" opacity=".85">${done}/${linked.length} · ${pct}%</text>`}else{svg+=`<text x="${x+NW/2}" y="${y+40}" text-anchor="middle" font-size="10" fill="${c.t}" opacity=".6">${st==='done'?'已完成':st==='progress'?'进行中':'待开始'}</text>`}svg+=`<rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="11" fill="transparent" style="cursor:${isAuto?'default':'pointer'}" ${isAuto?'':`onclick="cycleStage('${p.id}','${stg.id}')"`}/>`;svg+=`<text x="${x+NW-8}" y="${y+12}" text-anchor="end" font-size="8" fill="${c.t}" opacity=".4" style="cursor:pointer" onclick="event.stopPropagation();delStage('${p.id}','${stg.id}')">✕</text>`});svg+='</svg>';return svg}

function addSubPlan(parentId){editId=null;const parent=rec('study',parentId);const isMidParent=parent&&(parent.parentId||parent.isExec);const defType=isMidParent?'exec':'mid';openSheet(`<div class="sh"><h2>${defType==='exec'?'执行计划':'子计划'}</h2><button onclick="closeModal()">${IC.back}</button></div><div class="field"><label>标题</label><input id="f_title" placeholder="${defType==='exec'?'如:背单词':'如:雅思听力'}"></div><div class="field"><label>类型</label>${seg('f_type',['mid|中级计划','exec|执行计划'],defType,'pickPlanType')}</div><div class="field" id="milestoneField" style="display:${defType==='mid'?'block':'none'}"><label>阶段性目标 <span style="color:var(--text-faint);font-weight:400">（达成进度）</span></label><div style="font-size:12px;color:var(--text-faint);padding:8px 0">保存后可添加阶段性目标</div></div><div class="field" id="dailyField" style="display:${defType==='exec'?'block':'none'}"><label>每日目标 <span style="color:var(--text-faint);font-weight:400">（可选）</span></label><input id="f_daily" type="number" placeholder="如:50"></div><div class="field" id="scheduleField" style="display:${defType==='exec'?'block':'none'}"><label>执行频率</label>${seg('f_sched',['daily|每天','every2|隔天','every3|每3天','weekly|每周','custom|自定义'],'daily','pickSchedule')}<div id="customSchedField" style="display:none;margin-top:6px"><input id="f_sched_n" type="number" value="2" min="1" style="width:60px;text-align:center;border:1px solid var(--border);border-radius:var(--r);padding:4px 8px"> <span style="color:var(--text-muted);font-size:13px">天一次</span></div></div><div class="field" id="startDateField" style="display:${defType==='exec'?'block':'none'}"><label>开始日期</label><input type="date" id="f_sdate" value="${fmtISO(new Date())}"></div><div class="field"><label>备注</label><textarea id="f_note"></textarea></div><div class="btnrow"><button class="btn primary" onclick="saveSubPlan('${parentId}')">保存</button></div>`)}
function saveSubPlan(parentId){const type=segVal('f_type'),r={id:uid(),title:val('f_title'),parentId,dailyGoal:Number(val('f_daily')||0),note:val('f_note'),isExec:type==='exec'};if(type!=='exec'){r.milestones=[];const tg=val('f_target');if(tg&&Number(tg)>0){r.target=Number(tg);r.unit=val('f_unit')||'';r.current=Number(val('f_current')||0)}}if(type==='exec'){r.completions={};r.startDate=val('f_sdate')||fmtISO(new Date());const sv=segVal('f_sched')||'daily';if(sv==='daily')r.schedule={type:'daily'};else if(sv==='every2')r.schedule={type:'everyNdays',n:2};else if(sv==='every3')r.schedule={type:'everyNdays',n:3};else if(sv==='weekly')r.schedule={type:'weekly'};else r.schedule={type:'everyNdays',n:Number(val('f_sched_n')||2)}}upsert('study',r);Sync.push('study',r);closeModal();render()}
function saveSubPlanEdit(){const type=segVal('f_type'),ex=rec('study',editId);if(!ex)return;ex.title=val('f_title');ex.note=val('f_note');ex.isExec=type==='exec';if(type==='exec'){ex.dailyGoal=Number(val('f_daily')||0);if(!ex.completions)ex.completions={};ex.startDate=val('f_sdate')||fmtISO(new Date());const sv=segVal('f_sched')||'daily';if(sv==='daily')ex.schedule={type:'daily'};else if(sv==='every2')ex.schedule={type:'everyNdays',n:2};else if(sv==='every3')ex.schedule={type:'everyNdays',n:3};else if(sv==='weekly')ex.schedule={type:'weekly'};else ex.schedule={type:'everyNdays',n:Number(val('f_sched_n')||2)}}else{if(!ex.milestones)ex.milestones=[];const tg=val('f_target');if(tg&&Number(tg)>0){ex.target=Number(tg);ex.unit=val('f_unit')||'';ex.current=Number(val('f_current')||0)}else{delete ex.target;delete ex.unit;delete ex.current}}upsert('study',ex);Sync.push('study',ex);closeModal();render()}
function getExecTodosForDate(dateStr){
  const study=load('study');
  return study.filter(p=>p.isExec).filter(p=>{
    const sch=p.schedule||{};
    if(!sch.type||sch.type==='daily')return true;
    if(sch.type==='everyNdays'){
      const start=p.startDate||fmtISO(new Date());
      const d1=new Date(start),d2=new Date(dateStr);
      const diff=Math.round((d2-d1)/86400000);
      if(diff<0)return false;
      return diff%(sch.n||1)===0;
    }
    if(sch.type==='weekly'){
      const start=p.startDate||fmtISO(new Date());
      const d1=new Date(start),d2=new Date(dateStr);
      const diff=Math.round((d2-d1)/86400000);
      if(diff<0)return false;
      return diff%7===0;
    }
    return true;
  }).map(p=>{
    const done=(p.completions&&p.completions[dateStr])||false;
    const sch=p.schedule||{};
    let schedLabel='';
    if(!sch.type||sch.type==='daily')schedLabel=p.dailyGoal?(' · 每日'+p.dailyGoal):' · 每日';
    else if(sch.type==='everyNdays')schedLabel=' · 每'+(sch.n||2)+'天';
    else if(sch.type==='weekly')schedLabel=' · 每周';
    return{id:'exec_'+p.id+'_'+dateStr,planId:p.id,title:p.title+schedLabel,done:done,source:p.title,dateStr:dateStr,recurring:true};
  });
}
function toggleExecTodo(planId,dateStr){
  const a=load('study'),i=a.findIndex(x=>x.id===planId);if(i<0)return;
  if(!a[i].completions)a[i].completions={};
  if(a[i].completions[dateStr])delete a[i].completions[dateStr];else a[i].completions[dateStr]=true;
  a[i].updatedAt=now();save('study',a);Sync.push('study',a[i]);render();
}
function delExecPlan(planId){
  if(!confirm('删除此执行计划？关联的每日待办也会消失。'))return;
  const a=load('study');
  const toDel=new Set([planId]);
  let changed=true;
  while(changed){changed=false;a.forEach(p=>{if(p.parentId&&toDel.has(p.parentId)&&!toDel.has(p.id)){toDel.add(p.id);changed=true}})}
  const tomb=JSON.parse(localStorage.getItem('wb_deleted')||'[]');
  toDel.forEach(id=>{if(!tomb.includes(id))tomb.push(id)});
  localStorage.setItem('wb_deleted',JSON.stringify(tomb));
  const remaining=a.filter(p=>!toDel.has(p.id));
  save('study',remaining);
  localStorage.setItem('wb_unsynced','1');
  render();
}
function smartParseStudy(){
  const note=val('f_note');
  if(!note||!note.trim()){alert('请先在备注中写描述');return}
  const title=val('f_title');
  if(!title||!title.trim()){alert('请先填写标题');return}
  const startDate=val('f_sdate')||fmtISO(new Date());
  const tw=val('f_total');
  let bigPlanId=editId;
  if(!bigPlanId){bigPlanId=uid();const r={id:bigPlanId,title,startDate,totalWeeks:tw?Number(tw):null,currentWeek:Number(val('f_cur')||0),note};const btg=val('f_target');if(btg&&Number(btg)>0){r.target=Number(btg);r.unit=val('f_unit')||'';r.current=Number(val('f_current')||0)}upsert('study',r);Sync.push('study',r);editId=bigPlanId}
  const numMap={'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  let midTitles=[],midTargets={},execSpecs=[];
  note.split(/[\n。；;]/).map(l=>l.trim()).filter(l=>l).forEach(line=>{
    let m;
    if(m=line.match(/^每天(.+)/)){
      let rest=m[1].trim();let goal=0;let gm;
      if(gm=rest.match(/(\d+)\s*个/)){goal=Number(gm[1]);rest=rest.replace(/\d+\s*个\s*/,'')}
      execSpecs.push({title:rest,dailyGoal:goal,schedule:{type:'daily'},raw:line});
      return;
    }
    if(m=line.match(/^每隔(\d+)[天日](.+)/)){
      execSpecs.push({title:m[2].trim(),dailyGoal:0,schedule:{type:'everyNdays',n:Number(m[1])},raw:line});return;
    }
    if(m=line.match(/^每隔([一二三四五六七八九十两])[天日]?(.+)/)){
      execSpecs.push({title:m[2].trim(),dailyGoal:0,schedule:{type:'everyNdays',n:numMap[m[1]]||2},raw:line});return;
    }
    if(m=line.match(/^每周(.+)/)){
      execSpecs.push({title:m[1].trim(),dailyGoal:0,schedule:{type:'weekly'},raw:line});return;
    }
    const items=line.split(/[\s,，、]+/).map(s=>s.trim()).filter(s=>s.length>=1);
    let lastSubject=null;
    items.forEach(item=>{
      const inlineM=item.match(/^(.+?)(\d+(?:\.\d+)?)\s*(分|个|篇|次|小时|分钟|天|本|套|道|词)?$/);
      if(inlineM&&inlineM[1].length>=2){
        const subj=inlineM[1],target=Number(inlineM[2]),unit=inlineM[3]||'';
        if(!midTitles.includes(subj))midTitles.push(subj);
        midTargets[subj]={target,unit};lastSubject=subj;return
      }
      const tm=item.match(/^(\d+(?:\.\d+)?)\s*(分|个|篇|次|小时|分钟|天|本|套|道|词)?$/);
      if(tm&&lastSubject){midTargets[lastSubject]={target:Number(tm[1]),unit:tm[2]||''};return}
      if(item.length>=2){if(!midTitles.includes(item))midTitles.push(item);lastSubject=item}
    });
  });
  const study=load('study');
  let midMap={};
  midTitles.forEach(t=>{
    const ex=study.find(p=>p.parentId===bigPlanId&&p.title===t&&!p.isExec);
    const mt=midTargets[t];
    if(ex){midMap[t]=ex.id;if(mt&&!ex.target){ex.target=mt.target;ex.unit=mt.unit;ex.current=ex.current||0;upsert('study',ex)}}
    else{const midId=uid();const mid={id:midId,parentId:bigPlanId,title:t,milestones:[],isExec:false};if(mt){mid.target=mt.target;mid.unit=mt.unit;mid.current=0}upsert('study',mid);midMap[t]=midId}
  });
  let created=0;
  execSpecs.forEach(spec=>{
    let pId=bigPlanId,matchedMid=null;
    for(const[mt,mi]of Object.entries(midMap)){if(spec.title.includes(mt)||spec.raw.includes(mt)){pId=mi;matchedMid=mt;break}}
    let cleanTitle=spec.title;
    if(matchedMid)cleanTitle=matchedMid;
    else{
      cleanTitle=cleanTitle.replace(/^(进行|完成|做|写|练习|复习|看|读|背|听)\s*(一篇|一份|一套|一个|一次)?/,'').replace(/\d+\s*个\s*/,'').trim();
      if(cleanTitle.length<2)cleanTitle=spec.title;
    }
    const ex=study.find(p=>p.parentId===pId&&p.title===cleanTitle&&p.isExec);
    if(!ex){const eid=uid();upsert('study',{id:eid,parentId:pId,title:cleanTitle,dailyGoal:spec.dailyGoal,isExec:true,completions:{},schedule:spec.schedule,startDate});created++}
  });
  let msg=`已创建 ${midTitles.length} 个中级计划`;
  const tCount=Object.keys(midTargets).length;
  if(tCount)msg+=`（其中 ${tCount} 个已自动设目标值）`;
  if(execSpecs.length)msg+=`，${execSpecs.length} 个执行计划`;
  msg+=`\n中级计划：点开→设目标值→进度条自动计算，不设目标→勾选达成`;
  msg+=`\n执行计划将自动出现在日历和待办清单上。`;
  alert(msg);
  closeModal();render();
}

function milestoneSectionHTML(r){
  if(!r.id)return '<div style="font-size:12px;color:var(--text-faint);padding:8px 0">保存后可添加阶段性目标</div>';
  const ms=r.milestones||[];
  let html='<div class="ms-list" id="msList">'+milestoneRowsHTML(ms)+'</div>';
  html+=`<div style="font-size:11px;color:var(--text-faint);padding:4px 0 6px">填目标值=进度条自动计算，不填=勾选达成</div>`;
  html+=`<div class="ms-inline-add"><input type="date" id="ms_date" value="${fmtISO(new Date())}"><input type="text" id="ms_title" placeholder="如:雅思听力稳定7分" style="flex:1;min-width:80px"><input type="number" id="ms_target" placeholder="目标" style="width:55px" step="0.5"><input type="text" id="ms_unit" placeholder="单位" style="width:38px"><button class="btn ghost" style="padding:5px 10px;font-size:12px" onclick="addMilestoneInline()">+ 添加</button></div>`;
  return html;
}
function milestoneRowsHTML(ms){
  if(!ms.length)return '<div style="font-size:12px;color:var(--text-faint);padding:6px 0">暂无目标，添加一个吧</div>';
  return ms.map(m=>{
    const hasTarget=m.target!=null&&m.target>0;
    const cur=m.current||0;
    const pct=hasTarget?Math.min(100,Math.round(cur/m.target*100)):0;
    const autoDone=hasTarget&&cur>=m.target;
    const done=hasTarget?autoDone:m.done;
    if(hasTarget){
      return `<div class="ms-row ${done?'done':''}"><span class="ms-date">${m.date?fmtDate(m.date):'无日期'}</span><span class="ms-title">${esc(m.title)}</span><div class="ms-prog-inline"><div class="pbar" style="width:50px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none"><i style="width:${pct}%;height:100%;background:${done?'var(--success)':'var(--accent)'};display:block"></i></div><input type="number" class="ms-cur-input" value="${cur}" step="0.5" style="width:42px;border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:12px;text-align:center" onchange="updateMilestoneCurrent('${m.id}',this.value)" onfocus="this.select()">/<span style="font-size:12px;color:var(--text-muted)">${m.target}${esc(m.unit||'')}</span></div><span class="ms-del" onclick="delMilestoneInline('${m.id}')">删除</span></div>`;
    }
    return `<div class="ms-row ${done?'done':''}"><div class="ms-chk" onclick="toggleMilestoneInline('${m.id}')">${IC.chek}</div><span class="ms-date">${m.date?fmtDate(m.date):'无日期'}</span><span class="ms-title">${esc(m.title)}</span><span class="ms-del" onclick="delMilestoneInline('${m.id}')">删除</span></div>`;
  }).join('');
}
function renderMilestoneSection(){
  const p=rec('study',editId);if(!p)return;
  const el=document.getElementById('msList');if(!el)return;
  el.innerHTML=milestoneRowsHTML(p.milestones||[]);
}
function addMilestoneInline(){
  const p=rec('study',editId);if(!p)return;
  const dateEl=document.getElementById('ms_date'),titleEl=document.getElementById('ms_title'),targetEl=document.getElementById('ms_target'),unitEl=document.getElementById('ms_unit');
  const date=dateEl?dateEl.value:fmtISO(new Date());
  const title=titleEl?titleEl.value.trim():'';
  if(!title){alert('请写目标描述');return}
  let target=targetEl?Number(targetEl.value):null;
  let unit=unitEl?unitEl.value.trim():'';
  if(!target||target<=0){
    const am=title.match(/(\d+(?:\.\d+)?)\s*(分|个|篇|次|小时|分钟|天|本|套|道)/);
    if(am){target=Number(am[1]);unit=unit||am[2]}
  }
  p.milestones=p.milestones||[];
  const m={id:uid(),date:date||fmtISO(new Date()),title,done:false};
  if(target&&target>0){m.target=target;m.current=0;m.unit=unit||''}
  p.milestones.push(m);
  upsert('study',p);Sync.push('study',p);
  renderMilestoneSection();
}
function updateMilestoneCurrent(msId,val){
  const p=rec('study',editId);if(!p)return;
  const m=(p.milestones||[]).find(x=>x.id===msId);if(!m)return;
  m.current=Number(val)||0;
  if(m.target!=null&&m.target>0)m.done=m.current>=m.target;
  upsert('study',p);Sync.push('study',p);
  renderMilestoneSection();
}
function toggleMilestoneInline(msId){
  const p=rec('study',editId);if(!p)return;
  const m=(p.milestones||[]).find(x=>x.id===msId);if(!m)return;
  if(m.target!=null&&m.target>0)return;
  m.done=!m.done;
  upsert('study',p);Sync.push('study',p);
  renderMilestoneSection();
}
function delMilestoneInline(msId){
  const p=rec('study',editId);if(!p)return;
  p.milestones=(p.milestones||[]).filter(x=>x.id!==msId);
  upsert('study',p);Sync.push('study',p);
  renderMilestoneSection();
}

/* ====== Vocab: import + flashcard study ====== */
let vocabStudyId=null;
function openVocabSheet(r){
  r=r||{};editId=r.id||null;editType='vocab';
  const existingWords=r.words?r.words.map(w=>`${w.w} ${w.p?'/'+w.p+'/':''} ${w.m||''}`).join('\n'):'';
  openSheet(`<div class="sh"><h2>词表</h2><button onclick="closeModal()">${IC.back}</button></div>
    <div class="field"><label>词表名</label><input id="f_title" value="${esc(r.title||'')}" placeholder="如:雅思核心词汇"></div>
    <div class="field"><label>导入单词</label><textarea id="f_words" style="min-height:200px;font-family:var(--mono);font-size:13px" placeholder="abandon /əˈbændən/ 放弃&#10;abstract /ˈæbstrækt/ 抽象的&#10;account /əˈkaʊnt/ 账户">${esc(existingWords)}</textarea></div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:-8px;margin-bottom:var(--s3)">格式: 单词 [音标] [中文释义]，空格分隔</div>
    <div class="btnrow"><button class="btn primary" onclick="saveVocab()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`+(r.id?`<button class="btn danger" style="margin-top:var(--s2)" onclick="delRec('vocab','${r.id}');closeModal()">删除</button>`:''));
}
function saveVocab(){
  const text=val('f_words');
  const words=text.split('\n').map(line=>{
    line=line.trim();if(!line)return null;
    const m=line.match(/^(\S+)(?:\s+\/([^/]+)\/)?(?:\s+(.+))?$/);
    if(m)return{w:m[1],p:m[2]||'',m:m[3]||'',learned:false};
    return null;
  }).filter(Boolean);
  if(editId){
    const existing=rec('vocab',editId);
    if(existing&&(existing.words||[]).length){
      words.forEach(nw=>{const ow=existing.words.find(w=>w.w===nw.w);if(ow&&ow.learned)nw.learned=true});
    }
  }
  const r={id:editId||uid(),title:val('f_title'),words:words};
  upsert('vocab',r);Sync.push('vocab',r);closeModal();render();
}
function viewVocab(){
  if(!vocabStudyId)return'<div style="padding:var(--s6);text-align:center;color:var(--text-faint)">请从学习页面选择词表</div>';
  const list=rec('vocab',vocabStudyId);
  if(!list){vocabStudyId=null;return viewVocab()}
  const words=list.words||[];
  const learned=words.filter(w=>w.learned).length;
  const unlearned=words.filter(w=>!w.learned);
  if(!unlearned.length){
    let s=`<div class="pagehead"><button class="btn ghost" style="padding:8px 16px" onclick="vocabStudyId=null;go('study')">${IC.back} 返回</button></div>`;
    s+=`<div style="text-align:center;padding:var(--s6)"><div style="font-size:48px">🎉</div><h2>全部完成!</h2><p style="color:var(--text-muted)">已掌握 ${learned} 个单词</p><button class="btn primary" style="margin-top:var(--s4)" onclick="resetVocab('${list.id}')">重新开始</button></div>`;
    return s;
  }
  const word=unlearned[0];
  let s=`<div class="pagehead"><button class="btn ghost" style="padding:8px 16px" onclick="vocabStudyId=null;go('study')">${IC.back} 返回</button><div class="spacer"></div><span style="font-size:13px;color:var(--text-muted)">${learned}/${words.length}</span></div>`;
  s+=`<div class="vocab-progress"><div class="vp-bar"><i style="width:${Math.round(learned/words.length*100)}%"></i></div><span class="vp-txt">${learned}/${words.length}</span></div>`;
  s+=`<div class="flashcard" id="flashcard" onclick="flipCard()">`;
  s+=`<div class="fc-word">${esc(word.w)}</div>`;
  if(word.p)s+=`<div class="fc-phonetic">/${esc(word.p)}/</div>`;
  s+=`<div class="fc-meaning">${esc(word.m||'')}</div>`;
  s+=`<div style="margin-top:var(--s3);font-size:12px;color:var(--text-faint)">点击翻转</div>`;
  s+='</div>';
  s+=`<div class="btnrow"><button class="btn ghost" onclick="vocabMark(false)">还不熟</button><button class="btn primary" onclick="vocabMark(true)">已掌握</button></div>`;
  return s;
}
function flipCard(){const c=document.getElementById('flashcard');if(c)c.classList.toggle('flip')}
function vocabMark(known){
  const list=rec('vocab',vocabStudyId);if(!list)return;
  const unlearned=(list.words||[]).filter(w=>!w.learned);
  if(!unlearned.length)return;
  const word=unlearned[0];
  if(known){word.learned=true}
  else{const idx=list.words.indexOf(word);if(idx>=0){list.words.splice(idx,1);list.words.push(word)}}
  upsert('vocab',list);Sync.push('vocab',list);render();
}
function resetVocab(id){
  const list=rec('vocab',id);if(!list)return;
  (list.words||[]).forEach(w=>w.learned=false);
  upsert('vocab',list);Sync.push('vocab',list);render();
}

/* ====== Travel: geocoding + map + photos ====== */
let leafletLoading=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(leafletLoading)return leafletLoading;leafletLoading=new Promise(res=>{let jl=false,cl=false;const chk=()=>{if(jl&&cl)res()};const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.onload=()=>{cl=true;chk()};css.onerror=()=>{cl=true;chk()};document.head.appendChild(css);const js=document.createElement('script');js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';js.onload=()=>{jl=true;chk()};js.onerror=()=>{jl=true;chk()};document.head.appendChild(js)});return leafletLoading}
let travelMap=null;
function initTravelMap(){
  const el=document.getElementById('travelmap');if(!el||!window.L)return;
  if(travelMap){travelMap.remove();travelMap=null}
  try{
  travelMap=L.map('travelmap',{scrollWheelZoom:false}).setView([30,10],2);
  L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{maxZoom:18,attribution:'© AMap'}).addTo(travelMap);
  const trips=load('travel');const bounds=[];
  trips.forEach(t=>{if(t.lat==null||t.lng==null)return;const m=L.marker([t.lat,t.lng]).addTo(travelMap).bindPopup(esc(t.place||t.title||''));m.on('click',()=>{travelDetailId=t.id;go('travelDetail')});bounds.push([t.lat,t.lng])});
  if(bounds.length>1)travelMap.fitBounds(bounds,{padding:[30,30]});else if(bounds.length===1)travelMap.setView(bounds[0],5);
  setTimeout(()=>travelMap.invalidateSize(),120);
  }catch(e){console.warn('map init failed',e)}
}
function initDetailMap(){
  const el=document.getElementById('detailMap');if(!el||!window.L)return;
  const t=rec('travel',travelDetailId);if(!t||t.lat==null)return;
  try{
  const m=L.map('detailMap',{scrollWheelZoom:true}).setView([t.lat,t.lng],8);
  L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{maxZoom:18,attribution:'© AMap'}).addTo(m);
  L.marker([t.lat,t.lng]).addTo(m).bindPopup(esc(t.place||t.title||'')).openPopup();
  setTimeout(()=>m.invalidateSize(),120);
  }catch(e){}
}
let pickLatLng=null,pendingPhotos=[],pickerMap=null,pickerMarker=null,searchTimer=null;
function openTravelSheet(r){
  r=r||{};editId=r.id||null;editType='travel';
  pickLatLng=(r.lat!=null&&r.lng!=null)?{lat:r.lat,lng:r.lng}:null;
  pendingPhotos=[...(r.photos||[])];
  if(travelMap){travelMap.remove();travelMap=null}
  openSheet(`<div class="sh"><h2>Travel</h2><button onclick="closeModal()">${IC.back}</button></div>
    <div class="field"><label>地点（输入地名自动定位）</label><input id="f_place" value="${esc(r.place||'')}" placeholder="如:京都" oninput="searchPlace(this.value)" onkeydown="searchPlaceEnter(event)"><div id="searchResults" style="margin-top:4px"></div></div>
    <div class="field"><label>标题(可选)</label><input id="f_title" value="${esc(r.title||'')}"></div>
    <div class="field"><label>出行方式</label>${seg('f_method',['飞机','火车','自驾','步行','骑行','其他'],r.method||'飞机')}</div>
    <div class="field"><label>地图预览（搜索后自动定位，也可手动点选）</label><div id="pickmap" style="height:160px;overflow:hidden;border:1px solid var(--border);background:var(--surface-3);position:relative"></div></div>
    <div class="field"><label>出发日期</label><input type="date" id="f_start" value="${r.start||''}"></div>
    <div class="field"><label>到达日期</label><input type="date" id="f_end" value="${r.end||''}"></div>
    <div class="field"><label>笔记</label><textarea id="f_note">${esc(r.note||'')}</textarea></div>
    <div class="field"><label>行程攻略（可粘贴旅行计划，每行一天）</label><textarea id="f_itinerary" style="min-height:120px" placeholder="Day1: 抵达京都，入住酒店，游览清水寺&#10;Day2: 岚山竹林、天龙寺、渡月桥&#10;Day3: 伏见稻荷大社、宇治抹茶">${esc(r.itinerary||'')}</textarea></div>
    <div class="field"><label>照片(自动压缩)</label><input type="file" id="f_photos" accept="image/*" multiple><div class="photogrid" id="photogrid"></div></div>
    <div class="btnrow"><button class="btn primary" onclick="saveTravel()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`+(r.id?`<button class="btn danger" style="margin-top:var(--s2)" onclick="delRec('travel','${r.id}');closeModal()">删除</button>`:''));
  renderPhotoGrid();
  document.getElementById('f_photos').onchange=onPhotoSelect;
  setTimeout(()=>{loadLeaflet().then(()=>initPickerMap(r.lat,r.lng))},300);
}
function searchPlace(q){
  clearTimeout(searchTimer);
  const el=document.getElementById('searchResults');
  if(!q||q.length<2){if(el)el.innerHTML='';return}
  if(el)el.innerHTML='<div style="font-size:12px;color:var(--text-faint);padding:4px 0">搜索中...</div>';
  searchTimer=setTimeout(()=>{
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5`).then(r=>r.json()).then(data=>{
      const el=document.getElementById('searchResults');if(!el)return;
      const features=(data.features||[]).filter(f=>f.geometry&&f.geometry.coordinates);
      if(!features.length){el.innerHTML='<div style="font-size:12px;color:var(--text-faint);padding:4px 0">未找到地点，请换关键词</div>';return}
      const fmt=f=>{const p=f.properties||{};return[p.name,p.city,p.state,p.country].filter(Boolean).join(', ')};
      const name=f=>(f.properties||{}).name||(f.properties||{}).city||'未知';
      const first=features[0];
      const lat=first.geometry.coordinates[1],lng=first.geometry.coordinates[0];
      pickSearchResult(lat,lng,name(first));
      el.innerHTML=features.map((f,i)=>{const lat=f.geometry.coordinates[1],lng=f.geometry.coordinates[0];return`<div class="search-result" style="${i===0?'border-color:var(--accent);background:var(--accent-soft)':''}" onclick="pickSearchResult(${lat},${lng},'${esc(name(f))}')">${esc(fmt(f))}</div>`}).join('');
    }).catch(()=>{
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&accept-language=zh`).then(r=>r.json()).then(results=>{
        const el=document.getElementById('searchResults');if(!el)return;
        if(!results.length){el.innerHTML='<div style="font-size:12px;color:var(--text-faint);padding:4px 0">未找到地点，请换关键词</div>';return}
        const first=results[0];
        pickSearchResult(first.lat,first.lon,first.display_name.split(',')[0]);
        el.innerHTML=results.map((r,i)=>`<div class="search-result" style="${i===0?'border-color:var(--accent);background:var(--accent-soft)':''}" onclick="pickSearchResult(${r.lat},${r.lon},'${esc(r.display_name.split(',')[0])}')">${esc(r.display_name)}</div>`).join('');
      }).catch(()=>{
        const el=document.getElementById('searchResults');if(el)el.innerHTML='<div style="font-size:12px;color:var(--text-faint);padding:4px 0">搜索失败，请直接在地图上点选位置</div>';
      });
    });
  },500);
}
function searchPlaceEnter(e){
  if(e.key==='Enter'){
    e.preventDefault();
    const el=document.getElementById('searchResults');
    const first=el?.querySelector('.search-result');
    if(first)first.click();
  }
}
function pickSearchResult(lat,lng,name){
  pickLatLng={lat:parseFloat(lat),lng:parseFloat(lng)};
  const inp=document.getElementById('f_place');if(inp)inp.value=name;
  const el=document.getElementById('searchResults');if(el)el.innerHTML='';
  if(pickerMap){if(pickerMarker)pickerMap.removeLayer(pickerMarker);pickerMarker=L.marker([lat,lng]).addTo(pickerMap);pickerMap.setView([lat,lng],8)}
}
function initPickerMap(lat,lng){
  const el=document.getElementById('pickmap');
  if(!el){console.warn('pickmap element not found');return}
  if(!window.L){console.warn('Leaflet not loaded');return}
  if(pickerMap){pickerMap.remove();pickerMap=null;pickerMarker=null}
  try{
    el.style.position='relative';
    pickerMap=L.map('pickmap',{scrollWheelZoom:false,zoomControl:true,attributionControl:true}).setView([lat!=null?lat:35,lng!=null?lng:105],lat!=null?4:1);
    L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{maxZoom:18,attribution:'© AMap'}).addTo(pickerMap);
    if(lat!=null&&lng!=null){pickerMarker=L.marker([lat,lng]).addTo(pickerMap)}
    pickerMap.on('click',e=>{pickLatLng={lat:e.latlng.lat,lng:e.latlng.lng};if(pickerMarker)pickerMap.removeLayer(pickerMarker);pickerMarker=L.marker(e.latlng).addTo(pickerMap)});
    pickerMap.whenReady(()=>{pickerMap.invalidateSize();setTimeout(()=>pickerMap.invalidateSize(),100);setTimeout(()=>pickerMap.invalidateSize(),300)});
  }catch(e){console.error('pickmap init error:',e)}
}
function onPhotoSelect(e){const files=[...e.target.files];let i=0;(function next(){if(i>=files.length){renderPhotoGrid();return}compressImage(files[i]).then(b64=>{pendingPhotos.push(b64);i++;next()}).catch(()=>{i++;next()})})()}
function compressImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);try{res(c.toDataURL('image/jpeg',0.8))}catch(err){rej(err)}};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function renderPhotoGrid(){const g=document.getElementById('photogrid');if(!g)return;g.innerHTML=pendingPhotos.map((p,i)=>`<span class="phototile" onclick="rmPhoto(${i})"><img src="${p}"></span>`).join('')}
function rmPhoto(i){pendingPhotos.splice(i,1);renderPhotoGrid()}
function saveTravel(){const r={id:editId||uid(),place:val('f_place'),title:val('f_title'),method:segVal('f_method'),start:val('f_start'),end:val('f_end'),note:val('f_note'),itinerary:val('f_itinerary'),photos:pendingPhotos,lat:pickLatLng?pickLatLng.lat:null,lng:pickLatLng?pickLatLng.lng:null};upsert('travel',r);Sync.push('travel',r);closeModal();render()}

/* ====== afterRender ====== */
function afterRender(){
  if(cur!=='travel'&&cur!=='travelDetail'&&travelMap){travelMap.remove();travelMap=null}
  if(cur==='travel'&&document.getElementById('travelmap'))loadLeaflet().then(initTravelMap);
  if(cur==='travelDetail'&&document.getElementById('detailMap'))loadLeaflet().then(initDetailMap);
  if(cur==='note')layoutBubbles();
  if(cur==='journalEdit')updateWordCount();
}

/* ====== modal ====== */
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');if(pickerMap){pickerMap.remove();pickerMap=null;pickerMarker=null}if(cur==='travel'&&document.getElementById('travelmap')){setTimeout(()=>{loadLeaflet().then(initTravelMap)},200)}}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ====== settings ====== */
function openSettings(){const s=settings();openSheet(`<div class="sh"><h2>设置</h2><button onclick="closeModal()">${IC.back}</button></div><div class="section-title">云同步 (GitHub)</div><div class="setrow"><div class="sl">启用同步</div><div class="toggle ${s.syncEnabled?'on':''}" id="t_sync" onclick="tgSync()"><i></i></div></div><div class="setrow"><div class="sl">状态</div><div class="sv" id="syncstate">${s.syncEnabled?(s.ghToken?'已配置':'未配置 Token'):'未启用'}</div></div><div class="field"><label>GitHub Token</label><input id="sb_token" value="${esc(s.ghToken||'')}" placeholder="ghp_xxxxx" type="password"></div><div class="field"><label>GitHub 用户名</label><input id="sb_owner" value="${esc(s.ghOwner||'2vg898f7m5-droid')}" placeholder="用户名"></div><div class="field"><label>仓库名</label><input id="sb_repo" value="${esc(s.ghRepo||'worktable')}" placeholder="仓库名"></div><div class="field"><label>设备同步 ID（所有设备需一致）</label><input id="sb_uid" value="${esc(s.userId)}" placeholder="自动生成，可手动修改为与其他设备一致"></div><div style="font-size:12px;color:var(--text-muted);margin-top:-8px;margin-bottom:var(--s3)">在 github.com/settings/tokens 创建 Token（需 repo 权限）。同步 ID 需在所有设备上保持一致。修改数据后点击「推送全部」，另一台设备打开应用会自动拉取。</div><div class="btnrow"><button class="btn primary" onclick="saveSync()">保存并拉取</button><button class="btn ghost" onclick="pushAll();closeModal()">推送全部</button><button class="btn ghost" onclick="Sync.pull();closeModal()">立即拉取</button></div><div class="btnrow" style="margin-top:var(--s2)"><button class="btn ghost" onclick="runDiag()">诊断同步</button></div><div class="section-title" style="margin-top:var(--s5)">数据</div><div class="btnrow"><button class="btn ghost" onclick="exportData()">导出 JSON</button><button class="btn ghost" onclick="importData()">导入 JSON</button></div><div class="section-title" style="margin-top:var(--s5)">关于</div><div style="font-size:12.5px;color:var(--text-muted)">Worktable · 本地优先 PWA</div><div style="height:var(--s4)"></div>`)}
function tgSync(){const s=settings();s.syncEnabled=!s.syncEnabled;setSettings(s);openSettings()}
function saveSync(){const s=settings();s.ghToken=val('sb_token');s.ghOwner=val('sb_owner')||'2vg898f7m5-droid';s.ghRepo=val('sb_repo')||'worktable';const uidVal=val('sb_uid');if(uidVal)s.userId=uidVal;setSettings(s);Sync.sb=null;Sync.init().then(()=>{if(s.syncEnabled)Sync.pull()});closeModal()}
async function pushAll(silent){const s=settings();if(!s.syncEnabled){if(!silent)alert('请先启用同步');return}if(!s.ghToken){if(!silent)alert('请先配置 GitHub Token');return}await Sync.init();const allData={};let n=0;for(const [type,lsKey]of Object.entries(TYPES)){allData[lsKey]=load(lsKey);n+=allData[lsKey].length}allData._meta={userId:s.userId,updatedAt:new Date().toISOString()};allData._deleted=JSON.parse(localStorage.getItem('wb_deleted')||'[]');let sha='';try{const r=await fetch(`https://api.github.com/repos/${s.ghOwner}/${s.ghRepo}/contents/sync-data.json`,{headers:{Authorization:`token ${s.ghToken}`,Accept:'application/vnd.github.v3+json'}});if(r.ok){const d=await r.json();sha=d.sha}}catch(e){}const content=btoa(unescape(encodeURIComponent(JSON.stringify(allData))));const body={message:`sync: ${new Date().toISOString()}`,content};if(sha)body.sha=sha;try{const r=await fetch(`https://api.github.com/repos/${s.ghOwner}/${s.ghRepo}/contents/sync-data.json`,{method:'PUT',headers:{Authorization:`token ${s.ghToken}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){localStorage.removeItem('wb_unsynced');if(!silent)alert('已推送 '+n+' 条记录到 GitHub')}else{const err=await r.json();if(!silent)alert('推送失败: '+(err.message||r.status))}}catch(e){if(!silent)alert('推送失败: '+e.message)}}
function exportData(){const d={};Object.values(TYPES).forEach(t=>d[t]=load(t));d.settings=settings();const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workbench-backup-'+fmtISO(new Date())+'.json';a.click()}
async function runDiag(){const log=await Sync.diag();alert(log)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.values(TYPES).forEach(t=>{if(d[t])save(t,d[t])});if(d.settings)setSettings(d.settings);render();closeModal()}catch(err){alert('文件格式错误')}};r.readAsText(f)};i.click()}

document.getElementById('btnSettings').onclick=openSettings;
document.getElementById('btnSync').onclick=()=>{const s=settings();if(!s.syncEnabled||!s.ghToken){openSettings();return}if(localStorage.getItem('wb_unsynced')){pushAll(true).then(()=>Sync.pull())}else{Sync.pull()}};
document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
buildNav();(function(){const tomb=JSON.parse(localStorage.getItem('wb_deleted')||'[]');if(tomb.length)Object.values(TYPES).forEach(k=>{const a=load(k),f=a.filter(x=>!tomb.includes(x.id));if(f.length!==a.length)save(k,f)})})();render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='activated'&&!navigator.serviceWorker.controller)location.reload();
      });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    location.reload();
  });
}
Sync.init();
if(settings().syncEnabled)setTimeout(()=>Sync.pull(),800);
document.addEventListener('visibilitychange',()=>{const s=settings();if(!s.syncEnabled||!s.ghToken)return;if(document.hidden){if(localStorage.getItem('wb_unsynced')){pushAll(true)}}else{setTimeout(()=>{try{Sync.pull()}catch(e){}},300)}});
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='SW_UPDATED')location.reload()});
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
</script>
</body>
